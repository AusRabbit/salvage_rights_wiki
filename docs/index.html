<style>
  :root{

    }
  }

    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;

  *{box-sizing:border-box}

    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>

<script>
const PAGES  = [{"id": "recap", "title": "The Price of Renewal", "group": "Session V", "type": "doc", "typeLabel": "Session", "dek": "Session recap — safe to share with the table.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<p>The crew lifted off the dome planet with sand in every vent of the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a> and a passenger list they had not planned on. Somewhere in the ducting, <a class=\"wl\" href=\"#rhett\">Rhett</a> was keeping his head down and working off what he owed for putting the ship in the dirt.</p><h2>Sand in the Vents</h2><p>Hyperspace did what hyperspace does: wounds closed, tempers cooled, and a plate of <a class=\"wl\" href=\"#kess\">Kess</a>'s dinner was buried under a cough of grit from the air vent. The one injury that would not sleep off was his, and he could hardly stitch himself. <a class=\"wl\" href=\"#rethven\">Rethven</a> took the needle. <a class=\"wl\" href=\"#sel\">Sel</a> offered to assist, and <a class=\"wl\" href=\"#kess\">Kess</a> had to decide whether the clicking she had been making in the corridors at night was enough to keep her hands off him.</p><p>He let her help. It went better than anyone expected — <a class=\"wl\" href=\"#sel\">Sel</a> turned out to be a deep well of medical knowledge, which is either something she had always hidden or something that has recently become true of her.</p><h2>Sixteen Whiskies</h2><p>Three survivors of <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> were still aboard, huddled at the dining table with nowhere to be: <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>, who had inherited command he never asked for, and his two, <a class=\"wl\" href=\"#tavi-renn\">Cpl Tavi Renn</a> and <a class=\"wl\" href=\"#emon-vale\">Spc Emon Vale</a>. <a class=\"wl\" href=\"#carsk\">Carsk</a> went in on shared service history and a hand on the shoulder, and read the room well enough to catch <a class=\"wl\" href=\"#tavi-renn\">Cpl Tavi Renn</a>'s hand sliding under the table and <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>'s single, silent shake of the head.</p><p><a class=\"wl\" href=\"#kess\">Kess</a> defused it with hospitality — a percussive slap to the sand-jammed drinks machine produced a tray of <a class=\"wl\" href=\"#corellian-whiskey\">Corellian Whiskey</a>, and the tension went out of the room. What followed was, by any measure, the most productive drinking session the crew has had: sixteen whiskies deep, <a class=\"wl\" href=\"#carsk\">Carsk</a> was standing on the table leading a chorus, and the last of the <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> wariness dissolved into something that looked a lot like loyalty.</p><p>The admission, when it came, was blunt. <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>'s people had been sent along with orders that the crew were not supposed to come back. Whatever <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> owes them now, he owes the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> more.</p><h2>The Vain Commander</h2><p>Asked how one gets to <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>, <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> did not describe a fortress. He described a weakness. Every few cycles the commander slips off the books and goes to <a class=\"wl\" href=\"#naboo\">Naboo</a>, to the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> — a mountainside retreat of engineered waterfalls and domed roofs where the galaxy's elite buy their youth back a treatment at a time. <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> knows the retreat, and he knows when she is due.</p><p>The <a class=\"wl\" href=\"#specimen\">The Specimen</a>'s missing components are somewhere behind <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>, in a facility <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> says the seven of them could not crack. She herself, half-dressed in a spa robe, is another matter.</p><h2>Sixteen Tons of Exfoliating Sand</h2><p>The crew came in at the service entrance under the only cover story a ship full of grit could support: a bulk delivery of exfoliating sand. Traffic control was unconvinced, had no berth, no manifest and no patience, and held them in orbit for hours while the crew burned nerves in circles. Eventually the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> was allowed down onto a cramped auxiliary pad in the <a class=\"wl\" href=\"#servants-quarters\">The Servants' Quarters</a>, where no cargo could be unloaded and no repairs made.</p><p>Waiting at the bottom of the ramp was <a class=\"wl\" href=\"#vessaly\">Vessaly</a>, a bureaucrat with a data pad, two assistants and a security officer, all wearing the same expression at the sandy freighter now parked in their auxiliary port. He wanted forms the crew did not have, and answers about sixteen tons of cargo that plainly would not fit.</p><h2>It Goes Wrong at the Ramp</h2><p><a class=\"wl\" href=\"#carsk\">Carsk</a> lured one of the assistants aboard, put him against a bulkhead and made it clear that the crew needed uniforms. He may have overdone it — the young man went back down the ramp barely holding himself together. <a class=\"wl\" href=\"#rethven\">Rethven</a>, deciding that nobody was looking at him, made a break for the door and did not get there before the <a class=\"wl\" href=\"#security-officer\">The Security Officer</a> did.</p><p><a class=\"wl\" href=\"#kess\">Kess</a> ended the fight before it started: a few taps on his pad and the ship's weapons unfolded from the hull over the heads of two now thoroughly persuaded bureaucrats. The <a class=\"wl\" href=\"#security-officer\">The Security Officer</a> did not get the message, and he and <a class=\"wl\" href=\"#rethven\">Rethven</a> tumbled through a doorway into a corridor and out of everyone's sight. <a class=\"wl\" href=\"#carsk\">Carsk</a> arrived, got the man into a hold, and <a class=\"wl\" href=\"#rethven\">Rethven</a> finished it by loosening his own breath mask and exhaling <a class=\"wl\" href=\"#ammonia\">Ammonia</a> into the man's face until he went limp.</p><p>He is alive. Everyone checked twice.</p><h2>Thirty Percent</h2><p>Back at the ramp with uniforms, <a class=\"wl\" href=\"#security-cards\">Security Cards & Uniforms</a> and data pads in hand, <a class=\"wl\" href=\"#kess\">Kess</a> worked on <a class=\"wl\" href=\"#vessaly\">Vessaly</a> — no longer a hostage so much as a partner, once it emerged that he is exactly as corruptible as the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> is shiny. A story about very secret cargo for a very particular client, a negotiation that started at ten percent and somehow finished at thirty, and <a class=\"wl\" href=\"#vessaly\">Vessaly</a> was inside the plan.</p><p>He can find <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>. He also let slip two names nobody had before: <a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a>, a Nubian art dealer who comes here with her, and <a class=\"wl\" href=\"#tessick\">Tessick</a>, who shadows them both and whom <a class=\"wl\" href=\"#vessaly\">Vessaly</a> does not think is any kind of assistant.</p>", "backlinks": [], "search": "the price of renewal session recap — safe to share with the table."}, {"id": "timeline", "title": "Session Timeline", "group": "Session V", "type": "doc", "typeLabel": "Session", "dek": "Beats in order, with timestamps back into the recording.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<div class=\"beat\"><div class=\"t\">00:13</div><div class=\"b\"><strong>The title crawl</strong><p><a class=\"wl\" href=\"#carsk\">Carsk</a>'s player reads the opening. The crew escaped the dome with <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> mostly intact; the <a class=\"wl\" href=\"#specimen\">The Specimen</a> kept <a class=\"wl\" href=\"#vossk\">Vossk</a> and wants its components back from <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>.</p></div></div><div class=\"beat\"><div class=\"t\">00:14</div><div class=\"b\"><strong>Sand in the vents</strong><p>Departure from the dome planet. Grit pours onto <a class=\"wl\" href=\"#kess\">Kess</a>'s plate. <a class=\"wl\" href=\"#rhett\">Rhett</a> is somewhere aboard, avoiding everyone.</p></div></div><div class=\"beat\"><div class=\"t\">00:15</div><div class=\"b\"><strong>Destiny pool</strong><p>One dark, four light.</p></div></div><div class=\"beat\"><div class=\"t\">00:16</div><div class=\"b\"><strong>The critical injury</strong><p><a class=\"wl\" href=\"#rethven\">Rethven</a> makes the medicine check with <a class=\"wl\" href=\"#sel\">Sel</a> assisting. It clears, and <a class=\"wl\" href=\"#sel\">Sel</a> is revealed as a serious medical asset.</p></div></div><div class=\"beat\"><div class=\"t\">00:22</div><div class=\"b\"><strong>Engaging the Imperials</strong><p><a class=\"wl\" href=\"#carsk\">Carsk</a> opens with shared service history. <a class=\"wl\" href=\"#tavi-renn\">Cpl Tavi Renn</a>'s hand goes under the table; <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> shakes his head once.</p></div></div><div class=\"beat\"><div class=\"t\">00:29</div><div class=\"b\"><strong>Drinks</strong><p><a class=\"wl\" href=\"#kess\">Kess</a> percussively repairs the drinks machine and slides <a class=\"wl\" href=\"#corellian-whiskey\">Corellian Whiskey</a> down the table.</p></div></div><div class=\"beat\"><div class=\"t\">00:38</div><div class=\"b\"><strong>Sixteen whiskies</strong><p>A resilience check turns into a triumph. <a class=\"wl\" href=\"#carsk\">Carsk</a> ends up on the table singing; the squad's wariness collapses into respect.</p></div></div><div class=\"beat\"><div class=\"t\">00:52</div><div class=\"b\"><strong>Brak turns</strong><p>He tells the crew his orders were that they don't come back, and offers help anyway.</p></div></div><div class=\"beat\"><div class=\"t\">00:53</div><div class=\"b\"><strong>The plan</strong><p><a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> is vain, off the books, and due at the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> on <a class=\"wl\" href=\"#naboo\">Naboo</a>.</p></div></div><div class=\"beat\"><div class=\"t\">00:57</div><div class=\"b\"><strong>Cover story</strong><p>Sixteen tons of exfoliating sand, delivered to the service entrance.</p></div></div><div class=\"beat\"><div class=\"t\">01:02</div><div class=\"b\"><strong>Held in orbit</strong><p><a class=\"wl\" href=\"#kess\">Kess</a>'s charm check fails. Hours of circling; everyone takes two strain.</p></div></div><div class=\"beat\"><div class=\"t\">01:06</div><div class=\"b\"><strong>Landfall</strong><p>A cramped auxiliary berth in the <a class=\"wl\" href=\"#servants-quarters\">The Servants' Quarters</a>. No unloading, no repairs.</p></div></div><div class=\"beat\"><div class=\"t\">01:08</div><div class=\"b\"><strong>Vessaly</strong><p>The bureaucrat wants forms A433 and 732, and wants to know where the sand is.</p></div></div><div class=\"beat\"><div class=\"t\">01:14</div><div class=\"b\"><strong>Too hard</strong><p><a class=\"wl\" href=\"#carsk\">Carsk</a> puts an assistant against a bulkhead demanding uniforms. The young man barely holds it together.</p></div></div><div class=\"beat\"><div class=\"t\">01:17</div><div class=\"b\"><strong>The bolt</strong><p><a class=\"wl\" href=\"#rethven\">Rethven</a> makes a run for the door, fails the athletics check, and hits the <a class=\"wl\" href=\"#security-officer\">The Security Officer</a> instead. Combat.</p></div></div><div class=\"beat\"><div class=\"t\">01:29</div><div class=\"b\"><strong>Guns out</strong><p><a class=\"wl\" href=\"#kess\">Kess</a> unfolds the ship's weapons over the bureaucrats. They fold.</p></div></div><div class=\"beat\"><div class=\"t\">01:43</div><div class=\"b\"><strong>Through the door</strong><p>A triumph slams the <a class=\"wl\" href=\"#security-officer\">The Security Officer</a> into a panel. The door opens, the camera dies, and he and <a class=\"wl\" href=\"#rethven\">Rethven</a> tumble out of sight.</p></div></div><div class=\"beat\"><div class=\"t\">01:58</div><div class=\"b\"><strong>Lights out</strong><p><a class=\"wl\" href=\"#rethven\">Rethven</a> exhales <a class=\"wl\" href=\"#ammonia\">Ammonia</a> into his face. Combat ends. He's alive.</p></div></div><div class=\"beat\"><div class=\"t\">02:05</div><div class=\"b\"><strong>Thirty percent</strong><p><a class=\"wl\" href=\"#kess\">Kess</a> turns <a class=\"wl\" href=\"#vessaly\">Vessaly</a> with the promise of a cut.</p></div></div><div class=\"beat\"><div class=\"t\">02:11</div><div class=\"b\"><strong>Two new names</strong><p><a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a> and <a class=\"wl\" href=\"#tessick\">Tessick</a>. Session ends.</p></div></div><div class=\"beat\"><div class=\"t\">02:13</div><div class=\"b\"><strong>Close-out</strong><p>5 XP each. Obligation roll 59; <a class=\"wl\" href=\"#rethven\">Rethven</a>'s triggers.</p></div></div>", "backlinks": [], "search": "session timeline beats in order, with timestamps back into the recording."}, {"id": "threads", "title": "Open Threads", "group": "Session V", "type": "doc", "typeLabel": "Session", "dek": "What the campaign is currently holding unresolved.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<div class=\"thread hot\"><div class=\"st\">Active</div><h3>Reach Dane inside the Splendor</h3><p>The crew have uniforms, <a class=\"wl\" href=\"#security-cards\">Security Cards & Uniforms</a> and a bought bureaucrat. <a class=\"wl\" href=\"#vessaly\">Vessaly</a> needs time to locate <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> in a facility with a great deal going on. Nobody has a plan past getting in.</p></div><div class=\"thread hot\"><div class=\"st\">Clock running</div><h3>The prisoners won't keep</h3><p><a class=\"wl\" href=\"#vessaly\">Vessaly</a>'s assistants are aboard the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> with whiskey and eggs and a shift that ends. <a class=\"wl\" href=\"#vessaly\">Vessaly</a> said it himself: they'll already know we're missing. The <a class=\"wl\" href=\"#security-officer\">The Security Officer</a> needs a doctor.</p></div><div class=\"thread open\"><div class=\"st\">Primary</div><h3>Recover the Specimen's components</h3><p>The bargain for access beneath <a class=\"wl\" href=\"#the-dome\">The Dome</a>. <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> says <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> will never sell, and that the components sit in a secure facility the seven of them couldn't strike. Reaching her is step one; the facility is a separate problem entirely.</p></div><div class=\"thread open\"><div class=\"st\">Escalating</div><h3>What is inside Sel</h3><p>The clicking in the corridors, the medical knowledge that appeared from nowhere, and <a class=\"wl\" href=\"#carsk\">Carsk</a> announcing in front of her that he intends to remove it. She asked what he meant and got a promise to come back to it later.</p></div><div class=\"thread open\"><div class=\"st\">New</div><h3>Casimir and Tessick</h3><p>An art dealer who travels with <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>, and a shadow that <a class=\"wl\" href=\"#vessaly\">Vessaly</a> doesn't believe is an assistant. Both introduced in the last two minutes of the session.</p></div><div class=\"thread open\"><div class=\"st\">Triggered</div><h3>Rethven's obligation</h3><p>His fascination with the inexplicable fires next session. He plays at two less strain; the GM gets a licence to exploit it.</p></div><div class=\"thread open\"><div class=\"st\">Unresolved</div><h3>Brak wants off before Dane</h3><p>His condition for helping was being set down before the crew went near the commander. They're at <a class=\"wl\" href=\"#naboo\">Naboo</a> with her instead.</p></div><div class=\"thread open\"><div class=\"st\">Background</div><h3>Rhett's debt</h3><p>Still aboard, still slinking, still owing for the crash.</p></div><div class=\"thread open\"><div class=\"st\">Loose end</div><h3>Sixteen tons of sand</h3><p>Nobody at the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> has been given an answer about the cargo, and the manifest said sixteen tons before <a class=\"wl\" href=\"#kess\">Kess</a> revised it to 1.6.</p></div>", "backlinks": [], "search": "open threads what the campaign is currently holding unresolved."}, {"id": "carsk", "title": "Carsk", "group": "Player Characters", "type": "character", "typeLabel": "Character", "dek": "Furred war veteran. Brawler, alcoholic, occasional diplomat.", "conf": "hi", "confLabel": "Confirmed", "player": "adjutator_", "aliases": ["Karsk", "Kask", "Cask", "Casque", "Karst"], "html": "<p>A veteran of a real war, which is the credential that got him through the door with <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> when nothing else would have. Covered in fur and, by the end of sixteen whiskies, the most respected person in the room.</p><p>He works in two registers and switches between them without warning. In the first he is warm to the point of being disarming — a hand on <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>'s shoulder, sincere condolences about <a class=\"wl\" href=\"#vossk\">Vossk</a>, a song on the dining table. In the second he has a man against a bulkhead with <a class=\"wl\" href=\"#vibro-knucklers\">Vibro-knucklers</a> on, offering him the choice of conscious or unconscious, and is startled to find he has gone too far.</p><p>Holds a talent that lets him call in a small favour from current or former military personnel, and another that supports an ally's check simply by looking like a problem. Both saw use this session.</p><div class=\"panel note\"><div class=\"ph\">Transcription note</div><p>Four distinct surface forms in one session, none of them the correct spelling. The registry resolves them on phonetic similarity plus context; a names file would have caught it at the source.</p></div>", "backlinks": ["corellian-whiskey", "threads", "sel", "timeline", "brak-tanris", "recap", "security-officer", "vibro-knucklers"], "search": "carsk karsk kask cask casque karst furred war veteran. brawler, alcoholic, occasional diplomat."}, {"id": "kess", "title": "Kess", "group": "Player Characters", "type": "character", "typeLabel": "Character", "dek": "Pilot, mechanic and owner of the Wayfarer's Debt.", "conf": "hi", "confLabel": "Confirmed", "player": "thygmn", "aliases": ["Kes"], "html": "<p>Flies the ship, fixes the ship, and is visibly happier doing the second. Spent most of this session with a toothbrush in the cockpit trying to get dome sand out from under the buttons, and delivered some of his best work of the campaign while only half listening.</p><p>His charm is geographically limited. Aboard the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> his social checks are upgraded and he is smooth, hospitable and quick — pouring <a class=\"wl\" href=\"#corellian-whiskey\">Corellian Whiskey</a>, talking traffic control in circles, promising a bureaucrat thirty percent of a cargo that does not exist. Off the ship, by his own cheerful admission, he is nothing special.</p><p>Carries a tier-four <em>Mad Inventor</em> talent, unused so far: once per session he can attempt to cobble together the functional equivalent of any item out of salvage. He opened the evening carrying a critical injury from the dome, and closed it running a hostage situation like a dinner party.</p>", "backlinks": ["naboo", "threads", "rhett", "security-cards", "sel", "timeline", "recap", "specimen", "wayfarers-debt", "vessaly"], "search": "kess kes pilot, mechanic and owner of the wayfarer's debt."}, {"id": "rethven", "title": "Rethven", "group": "Player Characters", "type": "character", "typeLabel": "Character", "dek": "Gand. Ammonia breather, ten years in the Dome, obsessed with the inexplicable.", "conf": "hi", "confLabel": "Confirmed", "player": "aetius3185", "aliases": ["Rathven", "Rethvin", "Rethan", "Reflin", "Rathfin", "Gant"], "html": "<p>Spent a decade inside <a class=\"wl\" href=\"#the-dome\">The Dome</a> and has been almost nowhere since, which shows: he bounds down the ramp at the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> purely because it is somewhere new, and gets mistaken for a reclusive billionaire on the strength of not understanding what credits are.</p><p>Breathes <a class=\"wl\" href=\"#ammonia\">Ammonia</a> through a mask, which became a weapon when a glancing blow knocked it loose mid-scrap — he held his breath, sat on the <a class=\"wl\" href=\"#security-officer\">The Security Officer</a>'s chest and exhaled until the man stopped moving. Awkward, effective, and entirely in character.</p><p>His obligation is a fascination with what cannot be explained. It triggered on the closing roll, so the retreat is about to become interesting for him specifically.</p><div class=\"panel note\"><div class=\"ph\">Transcription note</div><p>Whisper repeatedly hears his species, <em>Gand</em>, as a personal name, \"Gant\" — and the table sometimes calls him that too. A naive extractor would create a separate character page for it. Flagged as an alias rather than merged silently, because a human should confirm this one.</p></div>", "backlinks": ["ammonia", "timeline", "the-dome", "recap", "security-officer"], "search": "rethven rathven rethvin rethan reflin rathfin gant gand. ammonia breather, ten years in the dome, obsessed with the inexplicable."}, {"id": "tavi-renn", "title": "Cpl Tavi Renn", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "dek": "Imperial. Reached under the table first.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Tavi", "Tabby"], "html": "<p>One of the two survivors still following <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>. During the first conversation aboard, her hand moved from the top of the table to underneath it and she exchanged a look with <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>, who shook his head once. That was a signal, and the crew saw it.</p>", "backlinks": ["timeline", "recap", "vossk-squad"], "search": "cpl tavi renn tavi tabby imperial. reached under the table first."}, {"id": "rhett", "title": "Rhett", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "dek": "Crashed the ship. Working off the debt. Avoiding everyone.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Ahet"], "html": "<p>Responsible for putting the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> into the dirt, and currently slinking around it feeling poorly about himself. <a class=\"wl\" href=\"#kess\">Kess</a> is in no hurry to let him leave — there is a debt to work off and nowhere to go.</p><div class=\"panel note warn\"><div class=\"ph\">Low confidence</div><p>The name is recovered from a single mangled line and never spelled out. Needs confirmation before it becomes canon.</p></div>", "backlinks": ["timeline", "recap"], "search": "rhett ahet crashed the ship. working off the debt. avoiding everyone."}, {"id": "sel", "title": "Sel", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "dek": "Crew. Something is inside her, and it may be helping.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["Cell"], "html": "<p>Wanted a gentler outcome at <a class=\"wl\" href=\"#the-dome\">The Dome</a> than the one she got, and is still sour about it. She is also making a clicking noise in the ship's corridors late at night, which <a class=\"wl\" href=\"#kess\">Kess</a> has not stopped thinking about.</p><p>She assisted on the medicine check that closed <a class=\"wl\" href=\"#kess\">Kess</a>'s critical injury, and proved a font of knowledge she has never demonstrated before. The open question is whether she always had it and hid it, or whether it arrived recently along with everything else.</p><p><a class=\"wl\" href=\"#carsk\">Carsk</a> has stated in front of her that he intends to get whatever is in her body out of it. She asked what he was talking about. Nobody answered.</p>", "backlinks": ["timeline", "recap"], "search": "sel cell crew. something is inside her, and it may be helping."}, {"id": "brak-tanris", "title": "Sgt Brak Tanris", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "dek": "Heavy weapons. Inherited command of what's left of Vossk's squad.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Brak", "Brack", "Barrack"], "html": "<p>Was the bulk of <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a>, not its brain, and command fell to him when <a class=\"wl\" href=\"#vossk\">Vossk</a> did not come back. Talks about himself in the third person. Holds his liquor. Referred to his dead commander's paperwork failings before he referred to his grief.</p><p>Warmed to <a class=\"wl\" href=\"#carsk\">Carsk</a> over an evening and sixteen whiskies, and came out the other side offering something he was not asked for: his people's help, and the knowledge of where <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> will be. He is the only remaining connection to her.</p><p>His caveat stands — his squad were sent to tie off loose ends, and the crew are the loose ends. He wants to be set down somewhere before anyone goes near the commander.</p>", "backlinks": ["carsk", "ilyra-dane", "tavi-renn", "threads", "timeline", "recap", "vossk-squad"], "search": "sgt brak tanris brak brack barrack heavy weapons. inherited command of what's left of vossk's squad."}, {"id": "emon-vale", "title": "Spc Emon Vale", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "dek": "Imperial. Took two glasses.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Emon", "Emin"], "html": "<p>The other survivor. Claimed two whiskies off the tray at once and was pleased with himself about it. Still moves like he thinks he is being stealthy in a corridor.</p>", "backlinks": ["recap", "vossk-squad"], "search": "spc emon vale emon emin imperial. took two glasses."}, {"id": "vossk", "title": "Vossk", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "dek": "Former squad leader. Kept by the Specimen.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Vosk", "Bosk"], "html": "<p>Led the Imperial squad into <a class=\"wl\" href=\"#the-dome\">The Dome</a> and did not leave it — the <a class=\"wl\" href=\"#specimen\">The Specimen</a> chose to keep him as part of the bargain. His survivors drank to him aboard the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> and then got on with their lives, which tells you something about the squad.</p>", "backlinks": ["carsk", "timeline", "brak-tanris", "the-dome", "specimen", "vossk-squad"], "search": "vossk vosk bosk former squad leader. kept by the specimen."}, {"id": "casimir-aldovane", "title": "Casimir Aldovane", "group": "Adversaries", "type": "character", "typeLabel": "Character", "dek": "Nubian art dealer. Travels with Dane.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Casimir Aldovana"], "html": "<p>Held in high esteem in Nubian political circles, and comes to the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> with <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> periodically, for treatments and — per <a class=\"wl\" href=\"#vessaly\">Vessaly</a> — other things. Introduced in the closing minutes of the session and entirely unexamined.</p>", "backlinks": ["ilyra-dane", "timeline", "recap"], "search": "casimir aldovane casimir aldovana nubian art dealer. travels with dane."}, {"id": "ilyra-dane", "title": "Commander Ilyra Dane", "group": "Adversaries", "type": "character", "typeLabel": "Character", "dek": "Imperial commander. Vain, off the books, and currently in a spa robe.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Elira Dane", "Ilya Dayne", "Elenia Dane", "Elyra Dane", "Lyra", "Mistress Dane"], "html": "<p>Holds the <a class=\"wl\" href=\"#specimen\">The Specimen</a>'s missing components and, by <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>'s account, will never part with them for credits. She is not a person the crew can buy; she is a person they have to reach.</p><p>Her weakness is her face. Every few cycles she goes quietly to <a class=\"wl\" href=\"#naboo\">Naboo</a> and checks into the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> for treatments meant to restore the sharp, hawkish look she had as a young officer. She travels off the books. <a class=\"wl\" href=\"#vessaly\">Vessaly</a> has her on the guest list as <em>Mistress Dane</em> and did not connect her to any Imperial rank at all.</p><p>She arrived a few days ago. She is not alone — <a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a> comes with her, and <a class=\"wl\" href=\"#tessick\">Tessick</a> shadows them both.</p><div class=\"panel note\"><div class=\"ph\">Five surface forms, one person</div><p>The table itself could not settle on a pronunciation, so the transcript carries every attempt. This is the entity that most justifies a human approval step: an automated merge on phonetic distance alone could just as easily have split her into two commanders.</p></div>", "backlinks": ["casimir-aldovane", "threads", "timeline", "brak-tanris", "the-dome", "recap", "specimen"], "search": "commander ilyra dane elira dane ilya dayne elenia dane elyra dane lyra mistress dane imperial commander. vain, off the books, and currently in a spa robe."}, {"id": "tessick", "title": "Tessick", "group": "Adversaries", "type": "character", "typeLabel": "Character", "dek": "Shadows Dane and Casimir. Called an assistant. Probably isn't.", "conf": "lo", "confLabel": "Low confidence", "player": "", "aliases": ["Tessic", "Tessicvar"], "html": "<p>A very strange individual who is always with them. <a class=\"wl\" href=\"#vessaly\">Vessaly</a> describes him as an assistant and then immediately says he thinks it is more than that. The nature of that relationship is deliberately unresolved.</p><p><em>Earmarked for Jesse to run as an NPC next session; the character sheet is going out.</em></p>", "backlinks": ["ilyra-dane", "timeline", "recap"], "search": "tessick tessic tessicvar shadows dane and casimir. called an assistant. probably isn't."}, {"id": "security-officer", "title": "The Security Officer", "group": "Adversaries", "type": "character", "typeLabel": "Character", "dek": "Aqua Splendor. Fought two of the crew to a standstill, then breathed ammonia.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Reached the corridor door at the same moment <a class=\"wl\" href=\"#rethven\">Rethven</a> did and would not let go. Took a pin from <a class=\"wl\" href=\"#carsk\">Carsk</a>, kept reaching for his baton anyway, and was finally put out by <a class=\"wl\" href=\"#ammonia\">Ammonia</a>. He is alive, unconscious, and will need a doctor and a bio swab. His <a class=\"wl\" href=\"#security-cards\">Security Cards & Uniforms</a> and uniform are now the crew's.</p>", "backlinks": ["ammonia", "threads", "rethven", "security-cards", "timeline", "recap", "servants-quarters"], "search": "the security officer aqua splendor. fought two of the crew to a standstill, then breathed ammonia."}, {"id": "specimen", "title": "The Specimen", "group": "Adversaries", "type": "character", "typeLabel": "Character", "dek": "Beneath the Dome. Wants its missing parts back.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Kept <a class=\"wl\" href=\"#vossk\">Vossk</a> as part of a bargain and let the rest of them go. In exchange for access to whatever lies beneath <a class=\"wl\" href=\"#the-dome\">The Dome</a>, it asked the crew to recover its missing components from <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> — components the crew themselves cut off and sold.</p><p>It had tendrils in people and was controlling them, a detail <a class=\"wl\" href=\"#kess\">Kess</a> found reassuring on the grounds that it clearly knows its way around a body.</p><p><em>Table note: saying its name is a running bit with a secret clock attached. The transcript contains roughly thirty consecutive invocations. This is a genuinely hard case for a summariser, which will read the repetition as significance.</em></p>", "backlinks": ["ilyra-dane", "timeline", "the-dome", "recap", "vossk", "vossk-squad"], "search": "the specimen beneath the dome. wants its missing parts back."}, {"id": "vessaly", "title": "Vessaly", "group": "Adversaries", "type": "character", "typeLabel": "Character", "dek": "Head bureaucrat at the Aqua Splendor. Bought for thirty percent.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Vesely", "Vasily", "Fessily", "Vespa", "Vessel"], "html": "<p>Met the ship at the ramp with a data pad and a list of forms, and held the line on paperwork right up until the ship's guns came out. Cried, but less than his assistants, and was identified by <a class=\"wl\" href=\"#kess\">Kess</a> as the bravest of them on exactly that basis.</p><p>What turned him was not fear. It was the suggestion of an undeclared, very valuable cargo for a very particular client. He started licking his lips, forgot he was a prisoner, and negotiated himself from ten percent up to thirty. He has the run of the facility, a data pad full of its secrets, and a torn uniform that <a class=\"wl\" href=\"#kess\">Kess</a> offered to mend.</p><p>He is an asset for exactly as long as the arrangement is the best one available to him.</p>", "backlinks": ["casimir-aldovane", "ilyra-dane", "threads", "security-cards", "timeline", "tessick", "nubian-aqua-splendor", "recap"], "search": "vessaly vesely vasily fessily vespa vessel head bureaucrat at the aqua splendor. bought for thirty percent."}, {"id": "naboo", "title": "Naboo", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Core-ward. Has sand, whatever anyone says.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Destination of the hyperspace jump <a class=\"wl\" href=\"#kess\">Kess</a> quietly set while claiming he could not redirect. The <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> sits in its mountains, well above the swamps.</p>", "backlinks": ["ilyra-dane", "threads", "timeline", "nubian-aqua-splendor", "recap"], "search": "naboo core-ward. has sand, whatever anyone says."}, {"id": "the-dome", "title": "The Dome", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Where the last session happened, and where the Specimen still is.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>The crew escaped it with <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> mostly intact; the <a class=\"wl\" href=\"#specimen\">The Specimen</a> kept <a class=\"wl\" href=\"#vossk\">Vossk</a>. <a class=\"wl\" href=\"#rethven\">Rethven</a> was inside for ten years. Access to whatever lies beneath it is the prize the <a class=\"wl\" href=\"#specimen\">The Specimen</a> is dangling, and the price is the components <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> is holding.</p>", "backlinks": ["threads", "rethven", "sel", "specimen", "vossk", "vossk-squad"], "search": "the dome where the last session happened, and where the specimen still is."}, {"id": "nubian-aqua-splendor", "title": "The Nubian Aqua Splendor", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Mountainside health retreat on Naboo. Shiny, and not upstanding.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Classic Nubian architecture on a <a class=\"wl\" href=\"#naboo\">Naboo</a> mountainside — domed roofs, browns and greens, and waterfalls that have been hydro-engineered rather than left to fall, diverted through bridges and spans until one strikes a central building and sprays out in a rainbow arc.</p><p>The galaxy's elite come here for treatments and discretion. Beneath the shine, per <a class=\"wl\" href=\"#vessaly\">Vessaly</a>, money greases everything: it may look immaculate but it is anything but an upstanding facility.</p><p>The crew came in at the <a class=\"wl\" href=\"#servants-quarters\">The Servants' Quarters</a> and have not yet seen the facility proper.</p>", "backlinks": ["casimir-aldovane", "ilyra-dane", "naboo", "threads", "rethven", "security-cards", "timeline", "stealth-field-generator", "recap", "servants-quarters", "wayfarers-debt"], "search": "the nubian aqua splendor mountainside health retreat on naboo. shiny, and not upstanding."}, {"id": "servants-quarters", "title": "The Servants' Quarters", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Auxiliary landing pads, several levels below the shine.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "html": "<p>Grimier and grungier than the rest of the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>, though still tasteful by Nubian standards. Recruit grey, no red carpet, and a long way up to the facility. The <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> barely fits in the berth. One corridor door, one unconscious <a class=\"wl\" href=\"#security-officer\">The Security Officer</a>, and — thanks to a lucky triumph — one dead camera.</p>", "backlinks": ["timeline", "nubian-aqua-splendor", "recap", "wayfarers-debt"], "search": "the servants' quarters auxiliary landing pads, several levels below the shine."}, {"id": "wayfarers-debt", "title": "The Wayfarer's Debt", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "The crew's freighter. Full of sand. Kess's pride and joy.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Wayfarer's Jet", "Wayfarer's Dead"], "html": "<p>Small, ugly, uniquely beautiful depending on who is describing it, and currently carrying most of a desert in its ducting. None of the buttons are labelled and none of them do what you would expect.</p><p>Aboard her, <a class=\"wl\" href=\"#kess\">Kess</a>'s social checks are upgraded — a mechanical quirk the crew leaned on twice this session. She also has weapons that fold out of the hull on command, which ended a fight before it began. The hyperspace generator is described as tenuous, though that may have been part of a lie.</p><p>Currently parked in an auxiliary berth in the <a class=\"wl\" href=\"#servants-quarters\">The Servants' Quarters</a> of the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>, too cramped for repairs or unloading, with three prisoners, three ex-Imperials, and a stowaway aboard.</p>", "backlinks": ["kess", "threads", "rhett", "recap", "servants-quarters", "vossk", "vossk-squad"], "search": "the wayfarer's debt wayfarer's jet wayfarer's dead the crew's freighter. full of sand. kess's pride and joy."}, {"id": "ammonia", "title": "Ammonia", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "What Rethven breathes. Also, as of this session, a weapon.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Contained by <a class=\"wl\" href=\"#rethven\">Rethven</a>'s mask under normal circumstances. When a glancing blow dislodged part of it mid-brawl, he held his breath and used the leak deliberately on the <a class=\"wl\" href=\"#security-officer\">The Security Officer</a>.</p>", "backlinks": ["rethven", "timeline", "recap", "security-officer"], "search": "ammonia what rethven breathes. also, as of this session, a weapon."}, {"id": "corellian-whiskey", "title": "Corellian Whiskey", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "The session's actual MVP.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Carillion whiskey", "Corellian brandy"], "html": "<p>Produced from a sand-jammed drinks machine by percussive maintenance, and responsible for turning three hostile Imperials into crew. Sixteen of them went into <a class=\"wl\" href=\"#carsk\">Carsk</a>. Later offered to prisoners as a courtesy.</p>", "backlinks": ["kess", "timeline", "recap"], "search": "corellian whiskey carillion whiskey corellian brandy the session's actual mvp."}, {"id": "security-cards", "title": "Security Cards & Uniforms", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "Taken at the ramp. The way in.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Stripped from <a class=\"wl\" href=\"#vessaly\">Vessaly</a>'s party and the <a class=\"wl\" href=\"#security-officer\">The Security Officer</a>, along with data pads. The whole point of the confrontation, and the crew's cover for moving inside the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>. <a class=\"wl\" href=\"#kess\">Kess</a> has offered to mend the torn one so it looks less suspicious when he wears it.</p>", "backlinks": ["threads", "recap", "security-officer"], "search": "security cards & uniforms taken at the ramp. the way in."}, {"id": "stealth-field-generator", "title": "Stealth Field Generator", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "Rethven's loot reward. Still in its box.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Chosen over better armour or a jacket. Unused so far, and the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> is the obvious place for that to change.</p>", "backlinks": [], "search": "stealth field generator rethven's loot reward. still in its box."}, {"id": "vibro-knucklers", "title": "Vibro-knucklers", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "Carsk's. Pierce 1, Vicious 1, and a boost die on every combat check.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Knuckle-dusters, not knuckles — a distinction <a class=\"wl\" href=\"#carsk\">Carsk</a> was delighted to have confirmed. He asked for a basic bit of gear and got something with teeth. Worn in the pocket rather than on the hand, which costs a manoeuvre to deploy and has already been the subject of one argument about whether he simply wears them to dinner.</p>", "backlinks": ["carsk"], "search": "vibro-knucklers carsk's. pierce 1, vicious 1, and a boost die on every combat check."}, {"id": "vossk-squad", "title": "Vossk's Squad", "group": "Factions", "type": "faction", "typeLabel": "Faction", "dek": "Three survivors, one dead commander, and orders they've stopped following.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Vosk's Squad", "The ex-Imperials"], "html": "<p>Sent into <a class=\"wl\" href=\"#the-dome\">The Dome</a> alongside the crew with a second set of orders: no loose ends. They lost <a class=\"wl\" href=\"#vossk\">Vossk</a> and never beat the <a class=\"wl\" href=\"#specimen\">The Specimen</a>. What is left — <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>, <a class=\"wl\" href=\"#tavi-renn\">Cpl Tavi Renn</a> and <a class=\"wl\" href=\"#emon-vale\">Spc Emon Vale</a> — kept their Imperial discipline and their hand signals right up until the whiskey, and have now thrown in with the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> for as long as it suits them.</p>", "backlinks": ["carsk", "timeline", "brak-tanris", "the-dome", "recap"], "search": "vossk's squad vosk's squad the ex-imperials three survivors, one dead commander, and orders they've stopped following."}];
const TITLES = {"ammonia": "Ammonia", "brak-tanris": "Sgt Brak Tanris", "carsk": "Carsk", "casimir-aldovane": "Casimir Aldovane", "corellian-whiskey": "Corellian Whiskey", "emon-vale": "Spc Emon Vale", "ilyra-dane": "Commander Ilyra Dane", "kess": "Kess", "naboo": "Naboo", "nubian-aqua-splendor": "The Nubian Aqua Splendor", "recap": "The Price of Renewal", "rethven": "Rethven", "rhett": "Rhett", "security-cards": "Security Cards & Uniforms", "security-officer": "The Security Officer", "sel": "Sel", "servants-quarters": "The Servants' Quarters", "specimen": "The Specimen", "stealth-field-generator": "Stealth Field Generator", "tavi-renn": "Cpl Tavi Renn", "tessick": "Tessick", "the-dome": "The Dome", "threads": "Open Threads", "timeline": "Session Timeline", "vessaly": "Vessaly", "vibro-knucklers": "Vibro-knucklers", "vossk-squad": "Vossk's Squad", "vossk": "Vossk", "wayfarers-debt": "The Wayfarer's Debt"};
const BUILT  = "2026-09-22";
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
let current = PAGES.length ? PAGES[0].id : "";

const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const q    = document.getElementById("q");

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + p.title + '</h1>';
  if(p.dek) h += '<div class="dek">' + p.dek + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  h += '<div class="prose">' + p.html + '</div>';

  if(p.backlinks.length){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + TITLES[b] + '</a></li>').join('')
       + '</ul></div>';
  }

  h += '<div class="foot">Generated from a Craig recording of Session V, transcribed with '
     + '<code>faster-whisper large-v3</code>. Entity names carry every surface form the transcript produced; '
     + 'anything marked <em>needs review</em> or <em>low confidence</em> is waiting on confirmation before it becomes canon. '
     + 'Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + p.title + '</span>'
        + (p.type !== "doc" && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : '')
        + '</a>').join('')
    + '</div>').join('');
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  nav.innerHTML = renderNav(q.value);
  document.title = (byId[current] ? byId[current].title + " · " : "") + "Salvage Rights";
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("wd-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("wd-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
