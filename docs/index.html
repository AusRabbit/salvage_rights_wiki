aboo", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "Core-ward home of the Nubian Aqua Splendor and its carefully hidden inequalities.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Destination of the hyperspace jump <a class=\"wl\" href=\"#kess\">Kess</a> quietly set while claiming he could not redirect. The <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> sits in its mountains, well above the swamps.</p><p>The crew's first day inside the resort exposed the divide beneath its polished Nubian surface: Gungan workers maintain the hidden infrastructure, while security officers such as <a class=\"wl\" href=\"#trent\">Trent</a> treat suspicion of them as routine.</p>", "backlinks": ["overview", "timeline", "ilyra-dane", "recap", "nubian-aqua-splendor"], "search": "naboo core-ward home of the nubian aqua splendor and its carefully hidden inequalities."}, {"id": "port-heska", "title": "Port Heska", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "The port where the crew tried to secure their evidence and broke Kallax's local operation.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>The crew brought the witnesses and evidence from the <a class=\"wl\" href=\"#harbingers-due\">CSS Harbinger's Due</a> here while both <a class=\"wl\" href=\"#cygnus-biotech\">Cygnus Biotech</a> and <a class=\"wl\" href=\"#verrin-kallax\">Captain Verrin Kallax</a> remained interested in what they carried.</p><p><a class=\"wl\" href=\"#marda-voss\">Marda Voss</a> sealed an anomaly recording, creating an evidence trail outside corporate control. A violent confrontation disrupted Kallax's local people and was captured by service surveillance. The crew escaped aboard the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a>, but the forensic and administrative consequences were never shown to be settled.</p><p>A later unidentified vessel used a Port Heska transponder shell while approaching <a class=\"wl\" href=\"#long-wake\">the Long Wake</a>. Its owner remains unknown.</p>", "backlinks": ["verrin-kallax", "marda-voss", "threads", "earlier-campaign", "rhett", "long-wake"], "search": "port heska the port where the crew tried to secure their evidence and broke kallax's local operation."}, {"id": "service-tunnels", "title": "Splendor Service Tunnels", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "A second resort hidden behind the walls, maintained by Gungan workers.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Maintenance tunnels", "Service passages"], "html": "<p>Broad passages, maintenance hatches and access corridors threaded throughout the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>. They connect the deep machinery levels to the guest floors and allow staff to move without crossing the resort's polished public spaces.</p><p><a class=\"wl\" href=\"#ottho\">Ottho</a> gave the crew access and led them to an unofficial terminal connected to staff cameras. From there, <a class=\"wl\" href=\"#kess\">Kess</a> used <a class=\"wl\" href=\"#security-officer\">Michael</a>'s security ID and the resort's facial recognition to locate him and map a fast route to the grand staircase.</p><p>The network also reaches the exterior maintenance routes around <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>'s suite, making it a possible approach for the next operation.</p>", "backlinks": ["timeline", "carsk", "kess", "threads", "ottho", "security-cards", "session-6", "severin", "nubian-aqua-splendor"], "search": "splendor service tunnels maintenance tunnels service passages a second resort hidden behind the walls, maintained by gungan workers."}, {"id": "the-dome", "title": "The Dome", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "Where the last session happened, and where the Specimen still is.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>The crew escaped it with <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> mostly intact; the <a class=\"wl\" href=\"#specimen\">The Specimen</a> kept <a class=\"wl\" href=\"#vossk\">Vossk</a>. <a class=\"wl\" href=\"#rethven\">Rethven</a> was inside for ten years. Access to whatever lies beneath it is the prize the <a class=\"wl\" href=\"#specimen\">The Specimen</a> is dangling, and the price is the components <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> is holding.</p>", "backlinks": ["overview", "ilyra-dane", "sel", "threads", "earlier-campaign", "rethven", "long-wake", "specimen", "vossk", "vossk-squad", "wreckfall-nine"], "search": "the dome where the last session happened, and where the specimen still is."}, {"id": "long-wake", "title": "The Long Wake", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "A moving scrap barge over Ord Mantell where the crew sold the specimen limb to Dane.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Long Wake"], "html": "<p>A vast scrap barge moving through Ord Mantell's lower atmosphere beneath rain, floodlights and magnetic cranes. The crew chose it as neutral ground for the sale of material recovered from the <a class=\"wl\" href=\"#harbingers-due\">CSS Harbinger's Due</a>.</p><p>Here <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> identified the organism as <a class=\"wl\" href=\"#specimen\">MYRMEX-9</a>, bought the severed limb and cryogenic equipment, and gave the crew the coordinates that eventually led back to <a class=\"wl\" href=\"#the-dome\">The Dome</a>.</p><p>An unidentified utility vessel approached during the sale using a <a class=\"wl\" href=\"#port-heska\">Port Heska</a> transponder shell. Dane's personnel and the barge's machinery covered the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a> as it escaped.</p>", "backlinks": ["ilyra-dane", "sel", "threads", "port-heska", "earlier-campaign", "specimen", "wreckfall-nine"], "search": "the long wake long wake a moving scrap barge over ord mantell where the crew sold the specimen limb to dane."}, {"id": "nubian-aqua-splendor", "title": "The Nubian Aqua Splendor", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "Nine-storey mountainside retreat on Naboo: luxury in front, machinery and service tunnels behind it.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Classic Nubian architecture on a <a class=\"wl\" href=\"#naboo\">Naboo</a> mountainside — domed roofs, browns and greens, and waterfalls that have been hydro-engineered rather than left to fall, diverted through bridges and spans until one strikes a central building and sprays out in a rainbow arc.</p><p>The galaxy's elite come here for treatments and discretion. The public levels are spacious and private despite the crowds: polished corridors, greenery, mountain alcoves, a broad red carpet and a vast waterfall descending through the central atrium. The falling water also feeds machinery in the levels below.</p><p>The crew entered through the <a class=\"wl\" href=\"#servants-quarters\">The Servants' Quarters</a> and now occupy a deluxe penthouse on the eighth of nine floors. Its transparent-steel panoramic wall can turn opaque, and its balcony looks across the exterior suites — including <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>'s.</p><h2>Behind the Walls</h2><p>The <a class=\"wl\" href=\"#service-tunnels\">Splendor Service Tunnels</a> connect machinery, staff areas and guest levels without crossing public corridors. Gungan workers, led by <a class=\"wl\" href=\"#ottho\">Ottho</a>, keep the Splendor operating from these hidden routes. A staff camera system uses facial recognition, while security chief <a class=\"wl\" href=\"#severin\">Severin</a> controls formal access.</p><p>The sun deck and pool are on Level 3. Long arms are prohibited above the lower levels; the crew's rifles and carbines are hidden in a secured cupboard below the public resort.</p><p>Beneath the shine, money greases everything. <a class=\"wl\" href=\"#vessaly\">Vessaly</a> can sell access, Ottho can bypass it, and <a class=\"wl\" href=\"#trent\">Trent</a>'s conduct suggests that resort security routinely targets its Gungan workforce.</p>", "backlinks": ["overview", "timeline", "casimir-aldovane", "ilyra-dane", "sel", "naboo", "ottho", "rethven", "rhett", "security-cards", "recap", "session-6", "severin", "service-tunnels", "stealth-field-generator", "servants-quarters", "wayfarers-debt"], "search": "the nubian aqua splendor nine-storey mountainside retreat on naboo: luxury in front, machinery and service tunnels behind it."}, {"id": "servants-quarters", "title": "The Servants' Quarters", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "Auxiliary landing pads, several levels below the shine.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "html": "<p>Grimier and grungier than the rest of the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>, though still tasteful by Nubian standards. Recruit grey, no red carpet, and a long way up to the facility. The <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> barely fits in the berth. One corridor door, one unconscious <a class=\"wl\" href=\"#security-officer\">Michael</a>, and — thanks to a lucky triumph — one dead camera.</p>", "backlinks": ["timeline", "recap", "nubian-aqua-splendor", "wayfarers-debt"], "search": "the servants' quarters auxiliary landing pads, several levels below the shine."}, {"id": "wayfarers-debt", "title": "The Wayfarer's Debt", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "The crew's freighter. Full of sand, witnesses and unresolved passengers.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Wayfarer's Jet", "Wayfarer's Dead"], "html": "<p>Small, ugly, uniquely beautiful depending on who is describing it, and currently carrying most of a desert in its ducting. None of the buttons are labelled and none of them do what you would expect.</p><p>Aboard her, <a class=\"wl\" href=\"#kess\">Kess</a>'s social checks are upgraded — a mechanical quirk the crew leaned on twice this session. She also has weapons that fold out of the hull on command, which ended a fight before it began. The hyperspace generator is described as tenuous, though that may have been part of a lie.</p><p>Currently parked in an auxiliary berth in the <a class=\"wl\" href=\"#servants-quarters\">The Servants' Quarters</a> of the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>, too cramped for repairs or unloading. <a class=\"wl\" href=\"#rhett\">Rhett Sorn</a> stayed behind to keep cleaning while the crew entered the resort. <a class=\"wl\" href=\"#sean\">Sean</a> and the other attendants remain connected to the confrontation at the ramp; <a class=\"wl\" href=\"#security-officer\">Michael</a> woke aboard and escaped back into the Splendor before being recaptured.</p><p>Carsk keeps his private investigation here: a board of faces and red string charting possible links to the terrorist attack that killed his family.</p>", "backlinks": ["harbingers-due", "overview", "timeline", "verrin-kallax", "carsk", "ilyra-dane", "kess", "security-officer", "threads", "port-heska", "earlier-campaign", "rhett", "sean", "recap", "session-6", "long-wake", "servants-quarters", "vossk", "vossk-squad"], "search": "the wayfarer's debt wayfarer's jet wayfarer's dead the crew's freighter. full of sand, witnesses and unresolved passengers."}, {"id": "wreckfall-nine", "title": "Wreckfall Nine", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "The rendezvous where the crew collected Dane's former quarantine team.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>The crew came here after the sale aboard <a class=\"wl\" href=\"#long-wake\">the Long Wake</a> to collect the four-person former Imperial quarantine team led by <a class=\"wl\" href=\"#vossk\">Vossk</a>. The group also included <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>, <a class=\"wl\" href=\"#tavi-renn\">Cpl Tavi Renn</a> and <a class=\"wl\" href=\"#emon-vale\">Spc Emon Vale</a>.</p><p>Their briefing connected the <a class=\"wl\" href=\"#specimen\">The Specimen</a> to the origin site and established the danger posed by its copied voices, personal knowledge and ability to exploit containment procedure. From Wreckfall Nine, the enlarged expedition continued toward <a class=\"wl\" href=\"#the-dome\">The Dome</a>.</p>", "backlinks": ["earlier-campaign"], "search": "wreckfall nine the rendezvous where the crew collected dane's former quarantine team."}, {"id": "ammonia", "title": "Ammonia", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "What Rethven breathes. Also, as of this session, a weapon.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Contained by <a class=\"wl\" href=\"#rethven\">Rethven</a>'s mask under normal circumstances. When a glancing blow dislodged part of it mid-brawl, he held his breath and used the leak deliberately on the <a class=\"wl\" href=\"#security-officer\">Michael</a>.</p>", "backlinks": ["timeline", "security-officer", "rethven", "recap"], "search": "ammonia what rethven breathes. also, as of this session, a weapon."}, {"id": "corellian-whiskey", "title": "Corellian Whiskey", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "The session's actual MVP.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Carillion whiskey", "Corellian brandy"], "html": "<p>Produced from a sand-jammed drinks machine by percussive maintenance, and responsible for turning three hostile Imperials into crew. Sixteen of them went into <a class=\"wl\" href=\"#carsk\">Carsk</a>. Later offered to prisoners as a courtesy.</p>", "backlinks": ["timeline", "kess", "recap"], "search": "corellian whiskey carillion whiskey corellian brandy the session's actual mvp."}, {"id": "security-cards", "title": "Security Cards & Uniforms", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "Taken at the ramp. One stolen ID now opens the Splendor's staff systems.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Stripped from <a class=\"wl\" href=\"#vessaly\">Vessaly</a>'s party and <a class=\"wl\" href=\"#security-officer\">Michael</a>, along with data pads. The uniforms and cards were the original cover for moving inside the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>, although Vessaly ultimately checked the crew in as guests.</p><p>Michael's security ID proved more valuable than the uniform. <a class=\"wl\" href=\"#kess\">Kess</a> used it at an unofficial terminal in the <a class=\"wl\" href=\"#service-tunnels\">Splendor Service Tunnels</a> to access staff facial recognition, locate Michael and plot a route to intercept him.</p>", "backlinks": ["security-officer", "recap", "session-6"], "search": "security cards & uniforms taken at the ramp. one stolen id now opens the splendor's staff systems."}, {"id": "stealth-field-generator", "title": "Stealth Field Generator", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "Rethven's loot reward. Still in its box.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Chosen over better armour or a jacket. Unused so far, and the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> is the obvious place for that to change.</p>", "backlinks": [], "search": "stealth field generator rethven's loot reward. still in its box."}, {"id": "vibro-knucklers", "title": "Vibro-knucklers", "group": "Things", "type": "thing", "typeLabel": "Item", "layout": "prose", "dek": "Carsk's. Pierce 1, Vicious 1, and a boost die on every combat check.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Knuckle-dusters, not knuckles — a distinction <a class=\"wl\" href=\"#carsk\">Carsk</a> was delighted to have confirmed. He asked for a basic bit of gear and got something with teeth. Worn in the pocket rather than on the hand, which costs a manoeuvre to deploy and has already been the subject of one argument about whether he simply wears them to dinner.</p>", "backlinks": ["carsk"], "search": "vibro-knucklers carsk's. pierce 1, vicious 1, and a boost die on every combat check."}, {"id": "cygnus-biotech", "title": "Cygnus Biotech", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "Corporate recovery force pursuing specimen assets, research and witnesses.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Cygnus", "Cygnus Biotech Recovery Division"], "html": "<p>Sent a recovery force to the <a class=\"wl\" href=\"#harbingers-due\">CSS Harbinger's Due</a> under quarantine authority. Its priority was the escaped research target and associated evidence, not the freighter's missing crew.</p><p><a class=\"wl\" href=\"#sel\">Dr. Sel Varo</a> is a former Cygnus insider and believes the company moves quickly from asset recovery to witness control. The crew escaped with <a class=\"wl\" href=\"#rhett\">Rhett Sorn</a>, specimen evidence and knowledge of the operation. Even after selling the physical limb to <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>, they remain people Cygnus may wish to contain.</p><p>The ledgers consistently treat Cygnus as a continuing threat, but do not establish how much it presently knows about the crew's location.</p>", "backlinks": ["harbingers-due", "verrin-kallax", "sel", "marda-voss", "threads", "port-heska", "earlier-campaign", "rhett"], "search": "cygnus biotech cygnus cygnus biotech recovery division corporate recovery force pursuing specimen assets, research and witnesses."}, {"id": "vossk-squad", "title": "Vossk's Squad", "group": "Factions", "type": "faction", "typeLabel": "Faction", "layout": "prose", "dek": "Three survivors, one dead commander, and orders they've stopped following.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Vosk's Squad", "The ex-Imperials"], "html": "<p>Sent into <a class=\"wl\" href=\"#the-dome\">The Dome</a> alongside the crew with a second set of orders: no loose ends. They lost <a class=\"wl\" href=\"#vossk\">Vossk</a> and never beat the <a class=\"wl\" href=\"#specimen\">The Specimen</a>. What is left — <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>, <a class=\"wl\" href=\"#tavi-renn\">Cpl Tavi Renn</a> and <a class=\"wl\" href=\"#emon-vale\">Spc Emon Vale</a> — kept their Imperial discipline and their hand signals right up until the whiskey, and have now thrown in with the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> for as long as it suits them.</p>", "backlinks": ["overview", "timeline", "carsk", "threads", "recap", "brak-tanris", "the-dome"], "search": "vossk's squad vosk's squad the ex-imperials three survivors, one dead commander, and orders they've stopped following."}, {"id": "talents", "title": "Talents", "group": "Reference", "type": "doc", "typeLabel": "Session", "layout": "talents", "dek": "Search and filter the full talent catalogue by tier, activation and ranked status.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<p>The catalogue uses the Star Wars narrative-dice wording from the shared talent reference. Use the controls below to narrow the list; ordinary text search also matches rules text and source abbreviations.</p>", "backlinks": [], "search": "talents search and filter the full talent catalogue by tier, activation and ranked status."}];

const TALENTS = [{"name": "All-Terrain Driver", "tier": 1, "activation": "Passive", "ranked": "No", "text": "Do not suffer usual penalties for driving through difficult terrain when using Driving.", "source": "ACRB, ETU, ND", "from": "All-Terrain Driver", "superseded": null, "search": "all-terrain driver 1 passive no do not suffer usual penalties for driving through difficult terrain when using driving. acrb, etu, nd all-terrain driver"}, {"name": "Apothecary", "tier": 1, "activation": "Passive", "ranked": "Yes", "text": "When a patient under your character’s care heals wounds from natural rest, they heal additional wounds equal to twice your character’s ranks in Apothecary.", "source": "ROT", "from": "Apothecary", "superseded": null, "search": "apothecary 1 passive yes when a patient under your character’s care heals wounds from natural rest, they heal additional wounds equal to twice your character’s ranks in apothecary. rot apothecary"}, {"name": "Bad Cop", "tier": 1, "activation": "Passive", "ranked": "Yes", "text": "May spend ▲▲ from a Deception or Coercion check to upgrade ability of a single ally's subsequent Social Interaction check against the target a number of times equal to ranks in Bad Cop.", "source": "FH, KTP", "from": "Bad Cop", "superseded": "V5.0", "search": "bad cop 1 passive yes may spend ▲▲ from a deception or coercion check to upgrade ability of a single ally's subsequent social interaction check against the target a number of times equal to ranks in bad cop. fh, ktp bad cop"}, {"name": "Black Market Contacts", "tier": 1, "activation": "Active (Incidental)", "ranked": "Yes", "text": "When purchasing illegal goods, may reduce rarity by 1 per rank of Black Market Contacts, increasing cost by 50 percent of base cost per reduction.", "source": "ECRB", "from": "Black Market Contacts", "superseded": null, "search": "black market contacts 1 active (incidental) yes when purchasing illegal goods, may reduce rarity by 1 per rank of black market contacts, increasing cost by 50 percent of base cost per reduction. ecrb black market contacts"}, {"name": "Bought Info", "tier": 1, "activation": "Active (Action)", "ranked": "No", "text": "When making any knowledge skill check, your character can instead use this talent to spend an amount of currency equal to fifty times the difficulty of the check and automatically succeed on the knowledge check with one uncanceled ✔ (instead of rolling). At your GM’s discretion, your character may not be able to use Bought Info if the information is particularly sensitive or difficult to find, or buying it doesn’t make narrative sense.", "source": "GCRB", "from": "Bought Info", "superseded": null, "search": "bought info 1 active (action) no when making any knowledge skill check, your character can instead use this talent to spend an amount of currency equal to fifty times the difficulty of the check and automatically succeed on the knowledge check with one uncanceled ✔ (instead of rolling). at your gm’s discretion, your character may not be able to use bought info if the information is particularly sensitive or difficult to find, or buying it doesn’t make narrative sense. gcrb bought info"}, {"name": "Brace", "tier": 1, "activation": "Active (Maneuver)", "ranked": "Yes", "text": "As a maneuver, the character may Brace himself. This allows a character to remove ⬛ per rank of Brace from the next skill check based on changing conditions, inclement weather, unstable surfaces, zero gravity, heavy gravity, or other disruptive physical obstacles that would make a skill check more difficult.", "source": "ACRB, ECRB", "from": "Brace", "superseded": null, "search": "brace 1 active (maneuver) yes as a maneuver, the character may brace himself. this allows a character to remove ⬛ per rank of brace from the next skill check based on changing conditions, inclement weather, unstable surfaces, zero gravity, heavy gravity, or other disruptive physical obstacles that would make a skill check more difficult. acrb, ecrb brace"}, {"name": "Bullrush", "tier": 1, "activation": "Active (Incidental)", "ranked": "No", "text": "When your character makes a Brawl, Melee (Light), or Melee (Heavy) combat check after using a maneuver to engage a target, you may spend ▲▲▲ or ★ to use this talent to knock the target prone and move them up to one range band away from your character.", "source": "ROT", "from": "Bullrush", "superseded": null, "search": "bullrush 1 active (incidental) no when your character makes a brawl, melee (light), or melee (heavy) combat check after using a maneuver to engage a target, you may spend ▲▲▲ or ★ to use this talent to knock the target prone and move them up to one range band away from your character. rot bullrush"}, {"name": "Call 'Em", "tier": 1, "activation": "Passive", "ranked": "No", "text": "Do not add ⬛ to combat checks due to the use of the Aim maneuver.", "source": "FC", "from": "Call 'Em", "superseded": null, "search": "call 'em 1 passive no do not add ⬛ to combat checks due to the use of the aim maneuver. fc call 'em"}, {"name": "Catfall", "tier": 1, "activation": "Passive", "ranked": "Yes", "text": "When rolling Athletics or Coordination to reduce damage from falling, add 🟦. In addition, reduce damage and strain suffered from a fall by 1 per rank of Catfall.", "source": "CCC-Tom Cruise", "from": "Catfall", "superseded": null, "search": "catfall 1 passive yes when rolling athletics or coordination to reduce damage from falling, add 🟦. in addition, reduce damage and strain suffered from a fall by 1 per rank of catfall. ccc-tom cruise catfall"}, {"name": "Challenge!", "tier": 1, "activation": "Active (Maneuver)", "ranked": "Yes", "text": "Once per encounter, your character may use this talent to choose a number of adversaries within short range no greater than your character’s ranks in Challenge! (a minion group counts as a single adversary for this purpose). Until the encounter ends or your character is incapacitated, these adversaries add 🟦 ": "ROT", "from": "Zealous Fire", "superseded": null, "search": "zealous fire 5 passive no each time your game master spends a story point, your character heals 2 strain. rot zealous fire"}];
const BUILT  = "2026-10-03";
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
let current = PAGES.length ? PAGES[0].id : "";

const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const q    = document.getElementById("q");

function esc(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function activationGroup(value){
  const a = String(value || "").toLowerCase();
  if(a === "passive") return "Passive";
  if(a.includes("out of turn") || a.includes("out-of-turn") || a.includes("oot")) return "Out of turn";
  if(a.includes("action")) return "Action";
  if(a.includes("maneuver")) return "Maneuver";
  return "Incidental";
}

function talentLibrary(){
  const tiers = [...new Set(TALENTS.map(t => t.tier))].sort((a,b) => a-b);
  return '<div class="talent-controls">'
    + '<input id="talent-q" type="search" placeholder="Search names, rules or sources&hellip;" aria-label="Search talents">'
    + '<select id="talent-tier" aria-label="Filter by tier"><option value="">All tiers</option>' + tiers.map(t => '<option value="' + t + '">Tier ' + t + '</option>').join('') + '</select>'
    + '<select id="talent-activation" aria-label="Filter by activation"><option value="">All activations</option><option>Passive</option><option>Action</option><option>Maneuver</option><option>Incidental</option><option>Out of turn</option></select>'
    + '<select id="talent-ranked" aria-label="Filter by ranked status"><option value="">Ranked or unranked</option><option value="Yes">Ranked</option><option value="No">Unranked</option></select>'
    + '</div><div class="talent-summary" id="talent-summary"></div><div class="talent-list" id="talent-list"></div>';
}

function wireTalentLibrary(){
  const search = document.getElementById("talent-q");
  if(!search) return;
  const tier = document.getElementById("talent-tier");
  const activation = document.getElementById("talent-activation");
  const ranked = document.getElementById("talent-ranked");
  const list = document.getElementById("talent-list");
  const summary = document.getElementById("talent-summary");
  function update(){
    const needle = search.value.trim().toLowerCase();
    const matches = TALENTS.filter(t =>
      (!needle || t.search.includes(needle)) &&
      (!tier.value || String(t.tier) === tier.value) &&
      (!activation.value || activationGroup(t.activation) === activation.value) &&
      (!ranked.value || t.ranked === ranked.value)
    );
    summary.textContent = matches.length + (matches.length === 1 ? " talent" : " talents") + " shown of " + TALENTS.length;
    list.innerHTML = matches.length ? matches.map(t =>
      '<article class="talent-card"><div class="talent-head"><h2>' + esc(t.name) + '</h2><span class="talent-tier">Tier ' + esc(t.tier) + '</span></div>'
      + '<div class="talent-meta">' + esc(t.activation) + ' · ' + (t.ranked === "Yes" ? "Ranked" : "Unranked") + '</div>'
      + '<p>' + esc(t.text) + '</p>'
      + '<div class="talent-source">Source: ' + esc(t.source || "Not listed") + (t.from && t.from !== t.name ? ' · Adapted from ' + esc(t.from) : '') + '</div>'
      + (t.superseded ? '<div class="talent-note">Superseded by version: ' + esc(t.superseded) + '</div>' : '')
      + '</article>').join('') : '<div class="talent-empty">No talents match these filters.</div>';
  }
  [search,tier,activation,ranked].forEach(el => el.addEventListener(el === search ? "input" : "change", update));
  update();
}

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + p.title + '</h1>';
  if(p.dek) h += '<div class="dek">' + p.dek + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  h += '<div class="prose">' + p.html + '</div>';
  if(p.layout === "talents") h += talentLibrary();

  if(p.backlinks.length){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + TITLES[b] + '</a></li>').join('')
       + '</ul></div>';
  }

  h += '<div class="foot">Built from campaign records and session recordings transcribed with '
     + '<code>faster-whisper large-v3</code>. Entity names carry every surface form the transcript produced; '
     + 'anything marked <em>needs review</em> or <em>low confidence</em> is waiting on confirmation before it becomes canon. '
     + 'Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + p.title + '</span>'
        + (p.type !== "doc" && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : '')
        + '</a>').join('')
    + '</div>').join('');
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  if(byId[current] && byId[current].layout === "talents") wireTalentLibrary();
  nav.innerHTML = renderNav(q.value);
  document.title = (byId[current] ? byId[current].title + " · " : "") + "Salvage Rights";
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("wd-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("wd-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
