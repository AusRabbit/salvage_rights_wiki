<style>
  :root{
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#191D23; --muted:#59636F; --line:#D6DBE1;
    --amber:#A66A12; --amber-soft:#F0E2CA;
    --teal:#1B6B67; --teal-soft:#D9EAE8;
    --rust:#9C3B2E; --rust-soft:#F2DFDB;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sp:clamp(16px,3vw,28px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
      --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
      --amber:#DFA244; --amber-soft:#3A2F1C;
      --teal:#56B4AD; --teal-soft:#16302F;
      --rust:#D4776A; --rust-soft:#3A221E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
    --amber:#DFA244; --amber-soft:#3A2F1C;
    --teal:#56B4AD; --teal-soft:#16302F;
    --rust:#D4776A; --rust-soft:#3A221E;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  .timeline-session{font-size:20px!important; margin:32px 0 16px!important; padding-bottom:7px!important; border-bottom:1px solid var(--line)!important}
  .timeline-session:first-child{margin-top:4px!important}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .talent-controls{display:grid; grid-template-columns:minmax(180px,2fr) repeat(3,minmax(120px,1fr)); gap:10px; margin:0 0 12px}
  .talent-controls input,.talent-controls select{width:100%; min-width:0; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink); font:14px var(--body)}
  .talent-controls input:focus,.talent-controls select:focus{outline:2px solid var(--amber); outline-offset:1px}
  .talent-summary{font:11px var(--mono); color:var(--muted); margin-bottom:14px}
  .talent-list{display:grid; gap:10px}
  .talent-card{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:14px 16px}
  .talent-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:5px}
  .talent-head h2{font-size:18px; line-height:1.2; border:0; padding:0; margin:0}
  .talent-tier{flex:none; font:10.5px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--amber); background:var(--amber-soft); border-radius:4px; padding:3px 7px}
  .talent-meta{font:10.5px var(--mono); color:var(--muted); margin-bottom:8px}
  .talent-card p{margin:0 0 8px}
  .talent-source{font-size:12.5px; color:var(--muted)}
  .talent-note{font-size:12.5px; color:var(--rust); margin-top:7px}
  .talent-empty{border:1px dashed var(--line); border-radius:9px; color:var(--muted); padding:22px; text-align:center}
  @media (max-width:720px){.talent-controls{grid-template-columns:1fr 1fr}.talent-controls input{grid-column:1/-1}}
  @media (max-width:460px){.talent-controls{grid-template-columns:1fr}.talent-controls input{grid-column:auto}}

  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>

<script>
const PAGES  = [{"id": "overview", "title": "Campaign Overview", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "The crew, the bargain, and the position at the end of Session VI.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<p>The crew of the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a> escaped <a class=\"wl\" href=\"#the-dome\">The Dome</a> after making a bargain with the <a class=\"wl\" href=\"#specimen\">The Specimen</a>: recover the components taken by <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>, and the creature will grant them access beneath the dome. The surviving members of <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> revealed where Dane could be reached off the books — the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> on <a class=\"wl\" href=\"#naboo\">Naboo</a>.</p><h2>Current Position</h2><p>The crew are installed in an eighth-floor penthouse under improvised guest identities. They have located Dane's suite, mapped service routes through the resort, retained covert access to its security network, and neutralised <a class=\"wl\" href=\"#security-officer\">Michael</a> for roughly twenty-four hours. Their weapons remain hidden in a secure cupboard below the public levels.</p><p>Their local fixer <a class=\"wl\" href=\"#vessaly\">Vessaly</a> now expects forty-five percent. <a class=\"wl\" href=\"#ottho\">Ottho</a>, the Gungan chief of maintenance, has shown them passages that bypass the guest corridors. Dane has not yet been approached.</p><h2>Immediate Pressure</h2><ul><li><a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a> and the presumed <a class=\"wl\" href=\"#tessick\">Tessick</a> cut short a conspiratorial conversation when Dane appeared.</li><li>The presumed Tessick may have noticed the crew watching from their balcony.</li><li><a class=\"wl\" href=\"#carsk\">Carsk</a> recognised an unnamed diplomat as a face from his investigation into the attack that killed his family.</li><li>Michael's coerced day off creates a clock, not a permanent solution.</li></ul><p>The reconstructed early plot is recorded separately in <a class=\"wl\" href=\"#earlier-campaign\">Previously in Salvage Rights</a>. The detailed current record is split into per-session recaps, the cumulative <a class=\"wl\" href=\"#timeline\">Campaign Timeline</a>, and the living <a class=\"wl\" href=\"#threads\">Open Threads</a> page.</p>", "backlinks": [], "search": "campaign overview the crew, the bargain, and the position at the end of session vi."}, {"id": "earlier-campaign", "title": "Previously in Salvage Rights", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "A deliberately broad reconstruction of the campaign before the complete session recordings.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<div class=\"panel note\"><div class=\"ph\">Reconstruction boundary</div><p>This history comes from evolving campaign ledgers and a partial narrative summary. It preserves only the plot spine that remained consistent across those records. Scene details, exact sequencing and provisional material have been omitted rather than allowed to compete with the recorded Sessions V and VI.</p></div><h2>The Harbinger's Due</h2><p>The <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a> answered a distress signal from the drifting freighter <a class=\"wl\" href=\"#harbingers-due\">CSS Harbinger's Due</a> in the Gorrath asteroid belt. <a class=\"wl\" href=\"#kess\">Kess</a> and <a class=\"wl\" href=\"#carsk\">Carsk</a> boarded while a rival salvage crew led by <a class=\"wl\" href=\"#verrin-kallax\">Captain Verrin Kallax</a> and a corporate recovery force closed on the same prize.</p><p>The derelict held an escaped organism capable of moving through conductive structures and interfering with ship systems. Cold and compartment isolation could hinder it, but not make it harmless. The salvage operation became a running fight through the ship.</p><p>The crew escaped with the wounded engineer <a class=\"wl\" href=\"#rhett\">Rhett Sorn</a>, a severed piece of the organism, cryogenic equipment and evidence that <a class=\"wl\" href=\"#cygnus-biotech\">Cygnus Biotech</a> had come to recover a specific target rather than rescue the missing crew. The organism later became known to them as <a class=\"wl\" href=\"#specimen\">MYRMEX-9</a>.</p><h2>Port Heska</h2><p>The survivors and evidence made the crew valuable to several competing interests. At <a class=\"wl\" href=\"#port-heska\">Port Heska</a>, Kallax's local people attempted to gain control of the situation while the crew sought a safer chain of custody.</p><p>The confrontation broke Kallax's immediate operation and left violence on service surveillance. <a class=\"wl\" href=\"#marda-voss\">Marda Voss</a> accepted and sealed an anomaly recording made from Rhett's evidence, although the crew did not surrender the physical sample to her. Cygnus may have learned that specimen data had been authenticated.</p><h2>The Long Wake</h2><p>The crew arranged to sell the severed limb and cryogenic equipment aboard <a class=\"wl\" href=\"#long-wake\">the Long Wake</a>, a moving scrap barge over Ord Mantell. The buyer was <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>, who identified the organism as MYRMEX-9 and connected it to an older Imperial quarantine programme and an Outer Rim origin site.</p><p>Dane paid the crew, supplied cover for the Wayfarer's Debt and provided the coordinates that kept the mystery alive. Her people helped cover the crew's departure when an unidentified vessel approached under a Port Heska transponder shell.</p><h2>Back to the Origin</h2><p>The crew later collected Dane's former quarantine team at <a class=\"wl\" href=\"#wreckfall-nine\">Wreckfall Nine</a> and returned to the origin world. The expedition established that the Imperial response had sealed the site without understanding it, and that the entity could imitate voices, use accurate personal knowledge and sometimes issue truthful warnings.</p><p>Evidence at a second structure indicated that unknown visitors had returned years after the Imperial withdrawal and left a recorder as a deliberate marker. The expedition into <a class=\"wl\" href=\"#the-dome\">The Dome</a> ultimately led to the bargain that drives the present campaign: recover the specimen's missing components from Dane's network in exchange for access beneath the site.</p>", "backlinks": ["overview"], "search": "previously in salvage rights a deliberately broad reconstruction of the campaign before the complete session recordings."}, {"id": "timeline", "title": "Campaign Timeline", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "timeline", "dek": "Session beats in order, with timestamps back into each recording.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<h2 class=\"timeline-session\">Session V</h2><div class=\"beat\"><div class=\"t\">00:13</div><div class=\"b\"><strong>The title crawl</strong><p>The crew escaped the dome with <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> mostly intact; the <a class=\"wl\" href=\"#specimen\">The Specimen</a> kept <a class=\"wl\" href=\"#vossk\">Vossk</a> and wants its components back from <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>.</p></div></div><div class=\"beat\"><div class=\"t\">00:14</div><div class=\"b\"><strong>Sand in the vents</strong><p>Departure from the dome planet. Grit pours onto <a class=\"wl\" href=\"#kess\">Kess</a>'s plate. <a class=\"wl\" href=\"#rhett\">Rhett Sorn</a> is somewhere aboard, avoiding everyone.</p></div></div><div class=\"beat\"><div class=\"t\">00:16</div><div class=\"b\"><strong>The critical injury</strong><p><a class=\"wl\" href=\"#rethven\">Rethven</a> makes the medicine check with <a class=\"wl\" href=\"#sel\">Dr. Sel Varo</a> assisting. It clears, and Sel is revealed as a serious medical asset.</p></div></div><div class=\"beat\"><div class=\"t\">00:22</div><div class=\"b\"><strong>Engaging the Imperials</strong><p><a class=\"wl\" href=\"#carsk\">Carsk</a> opens with shared service history. <a class=\"wl\" href=\"#tavi-renn\">Cpl Tavi Renn</a>'s hand goes under the table; <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> shakes his head once.</p></div></div><div class=\"beat\"><div class=\"t\">00:29</div><div class=\"b\"><strong>Drinks</strong><p>Kess percussively repairs the drinks machine and slides <a class=\"wl\" href=\"#corellian-whiskey\">Corellian Whiskey</a> down the table.</p></div></div><div class=\"beat\"><div class=\"t\">00:38</div><div class=\"b\"><strong>Sixteen whiskies</strong><p>Carsk ends up on the table singing; the squad's wariness collapses into respect.</p></div></div><div class=\"beat\"><div class=\"t\">00:52</div><div class=\"b\"><strong>Brak turns</strong><p>He tells the crew his orders were that they do not come back, and offers help anyway.</p></div></div><div class=\"beat\"><div class=\"t\">00:53</div><div class=\"b\"><strong>The plan</strong><p>Dane is vain, off the books, and due at the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> on <a class=\"wl\" href=\"#naboo\">Naboo</a>.</p></div></div><div class=\"beat\"><div class=\"t\">00:57</div><div class=\"b\"><strong>Cover story</strong><p>Sixteen tons of exfoliating sand, delivered to the service entrance.</p></div></div><div class=\"beat\"><div class=\"t\">01:02</div><div class=\"b\"><strong>Held in orbit</strong><p>Kess's charm check fails. Hours of circling; everyone takes two strain.</p></div></div><div class=\"beat\"><div class=\"t\">01:06</div><div class=\"b\"><strong>Landfall</strong><p>A cramped auxiliary berth in the <a class=\"wl\" href=\"#servants-quarters\">The Servants' Quarters</a>. No unloading, no repairs.</p></div></div><div class=\"beat\"><div class=\"t\">01:08</div><div class=\"b\"><strong>Vessaly</strong><p>The bureaucrat wants forms A433 and 732, and wants to know where the sand is.</p></div></div><div class=\"beat\"><div class=\"t\">01:17</div><div class=\"b\"><strong>The bolt</strong><p>Rethven makes a run for the door and collides with the <a class=\"wl\" href=\"#security-officer\">Michael</a>. Combat begins.</p></div></div><div class=\"beat\"><div class=\"t\">01:29</div><div class=\"b\"><strong>Guns out</strong><p>Kess unfolds the ship's weapons over the bureaucrats. They fold.</p></div></div><div class=\"beat\"><div class=\"t\">01:58</div><div class=\"b\"><strong>Lights out</strong><p>Rethven exhales <a class=\"wl\" href=\"#ammonia\">Ammonia</a> into the officer's face. Combat ends; he lives.</p></div></div><div class=\"beat\"><div class=\"t\">02:05</div><div class=\"b\"><strong>Thirty percent</strong><p>Kess turns Vessaly with the promise of a cut.</p></div></div><div class=\"beat\"><div class=\"t\">02:11</div><div class=\"b\"><strong>Two new names</strong><p><a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a> and <a class=\"wl\" href=\"#tessick\">Tessick</a>. Session ends.</p></div></div><h2 class=\"timeline-session\">Session VI</h2><div class=\"beat\"><div class=\"t\">00:20</div><div class=\"b\"><strong>Sean stays behind</strong><p><a class=\"wl\" href=\"#vessaly\">Vessaly</a> leaves <a class=\"wl\" href=\"#sean\">Sean</a> aboard the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a> with the unconscious officer.</p></div></div><div class=\"beat\"><div class=\"t\">00:22</div><div class=\"b\"><strong>Through the bowels</strong><p>The crew pass the waterfall power system and stash their long arms before entering the public resort.</p></div></div><div class=\"beat\"><div class=\"t\">00:30</div><div class=\"b\"><strong>Checking in</strong><p><a class=\"wl\" href=\"#rethven\">Rethven</a> fronts the group. “Mr Shubidua” and “Lenny” enter the guest record.</p></div></div><div class=\"beat\"><div class=\"t\">00:32</div><div class=\"b\"><strong>The penthouse</strong><p>An eighth-floor deluxe penthouse becomes the crew's base.</p></div></div><div class=\"beat\"><div class=\"t\">00:42</div><div class=\"b\"><strong>Working the cover</strong><p>Pilates for Rethven and <a class=\"wl\" href=\"#kess\">Kess</a>, treatments for Kess and <a class=\"wl\" href=\"#sel\">Dr. Sel Varo</a>, brandy and a balcony for <a class=\"wl\" href=\"#carsk\">Carsk</a>.</p></div></div><div class=\"beat\"><div class=\"t\">00:48</div><div class=\"b\"><strong>Dane sighted</strong><p>Carsk spots <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> with a man presumed to be <a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a> and fixes the location of her room.</p></div></div><div class=\"beat\"><div class=\"t\">00:57</div><div class=\"b\"><strong>A private argument</strong><p>Casimir and the presumed <a class=\"wl\" href=\"#tessick\">Tessick</a> speak conspiratorially, stop when Dane appears, and withdraw. The bodyguard glances towards the crew.</p></div></div><div class=\"beat\"><div class=\"t\">00:59</div><div class=\"b\"><strong>Another route</strong><p>Rethven notices maintenance workers using the exterior routes around Dane's suite.</p></div></div><div class=\"beat\"><div class=\"t\">01:03</div><div class=\"b\"><strong>Michael walks</strong><p>Vessaly reports that <a class=\"wl\" href=\"#security-officer\">Michael</a> has woken and left the ship. His cut drops from fifty to forty-five percent.</p></div></div><div class=\"beat\"><div class=\"t\">01:10</div><div class=\"b\"><strong>Ottho</strong><p>Vessaly introduces <a class=\"wl\" href=\"#ottho\">Ottho</a> at the Level 3 sun deck.</p></div></div><div class=\"beat\"><div class=\"t\">01:14</div><div class=\"b\"><strong>Behind the walls</strong><p>Ottho opens the <a class=\"wl\" href=\"#service-tunnels\">Splendor Service Tunnels</a> and provides an unofficial terminal.</p></div></div><div class=\"beat\"><div class=\"t\">01:18</div><div class=\"b\"><strong>Found on camera</strong><p>Kess uses Michael's stolen ID to find him near the grand staircase and map an intercept route.</p></div></div><div class=\"beat\"><div class=\"t\">01:22</div><div class=\"b\"><strong>Waterfall pursuit</strong><p>Carsk surfs down the lobby waterfall and catches Michael on the stairs.</p></div></div><div class=\"beat\"><div class=\"t\">01:28</div><div class=\"b\"><strong>The knife</strong><p>Carsk coerces Michael with a concealed vibroknife. <a class=\"wl\" href=\"#trent\">Trent</a> arrives.</p></div></div><div class=\"beat\"><div class=\"t\">01:35</div><div class=\"b\"><strong>The necklace</strong><p>Kess and Rethven divert Trent with a fabricated Gungan theft; Michael agrees to take a twenty-four-hour day off.</p></div></div><div class=\"beat\"><div class=\"t\">01:41</div><div class=\"b\"><strong>Close-out</strong><p>10 XP each. The obligation roll triggers Carsk.</p></div></div><div class=\"beat\"><div class=\"t\">01:43</div><div class=\"b\"><strong>A face from the board</strong><p>Carsk recognises an unnamed diplomat connected to his investigation into his family's deaths.</p></div></div>", "backlinks": ["overview"], "search": "campaign timeline session beats in order, with timestamps back into each recording."}, {"id": "threads", "title": "Open Threads", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "threads", "dek": "What the campaign is currently holding unresolved after Session VI.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<div class=\"thread hot\"><div class=\"st\">Ready</div><h3>Reach Dane's suite</h3><p>The crew know <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>'s room, have an eighth-floor base nearby and can move through the <a class=\"wl\" href=\"#service-tunnels\">Splendor Service Tunnels</a>. Exterior maintenance routes may offer another approach. The presumed <a class=\"wl\" href=\"#tessick\">Tessick</a> may already have noticed their surveillance.</p></div><div class=\"thread hot\"><div class=\"st\">New evidence</div><h3>Casimir and Tessick's private agenda</h3><p><a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a> and the presumed <a class=\"wl\" href=\"#tessick\">Tessick</a> held a terse, conspiratorial conversation and stopped the instant Dane appeared. Whatever they were discussing, they did not want her to hear it.</p></div><div class=\"thread hot\"><div class=\"st\">Obligation triggered</div><h3>The diplomat on Carsk's board</h3><p><a class=\"wl\" href=\"#carsk\">Carsk</a> recognised an unnamed diplomat as one of the faces linked to the terrorist attack that killed his family. The person was present inside the Splendor and has not yet been followed or identified.</p></div><div class=\"thread hot\"><div class=\"st\">Clock running</div><h3>Michael's twenty-four hours</h3><p><a class=\"wl\" href=\"#security-officer\">Michael</a> agreed under threat to punch out and stay in the crew's penthouse for a day. He has dependants, knows who abducted him and remains a witness rather than a recruit.</p></div><div class=\"thread open\"><div class=\"st\">Primary</div><h3>Recover the Specimen's components</h3><p>The bargain for access beneath <a class=\"wl\" href=\"#the-dome\">The Dome</a>. <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> says the components sit in a secure facility the seven of them could not strike. Dane is the lead, not the location.</p></div><div class=\"thread open\"><div class=\"st\">Escalating</div><h3>What is inside Sel</h3><p>The clicking in the corridors, the medical knowledge that appeared from nowhere, and <a class=\"wl\" href=\"#carsk\">Carsk</a> announcing in front of <a class=\"wl\" href=\"#sel\">Dr. Sel Varo</a> that he intends to remove it. The resort has supplied relaxation, not answers.</p></div><div class=\"thread open\"><div class=\"st\">Dormant threat</div><h3>Cygnus witness control</h3><p><a class=\"wl\" href=\"#cygnus-biotech\">Cygnus Biotech</a> lost control of the Harbinger recovery, while the crew escaped with <a class=\"wl\" href=\"#rhett\">Rhett Sorn</a>, <a class=\"wl\" href=\"#sel\">Dr. Sel Varo</a> and evidence of what happened. Selling the physical limb did not erase those witnesses or the data trail.</p></div><div class=\"thread open\"><div class=\"st\">Unresolved</div><h3>Kallax's response</h3><p><a class=\"wl\" href=\"#verrin-kallax\">Captain Verrin Kallax</a> survived the first salvage conflict and his local network was later broken at <a class=\"wl\" href=\"#port-heska\">Port Heska</a>. He may retaliate, bargain, or sell what he knows about the crew and the specimen.</p></div><div class=\"thread open\"><div class=\"st\">Persistent</div><h3>Sel's concealed history</h3><p>Sel's connection to Cygnus predates the crew. <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> recognised her aboard <a class=\"wl\" href=\"#long-wake\">the Long Wake</a>, and the earlier expedition records also preserve a strong reaction from <a class=\"wl\" href=\"#vossk\">Vossk</a>. Sel has never given the crew the complete account.</p></div><div class=\"thread open\"><div class=\"st\">Evidence trail</div><h3>Marda's sealed evidence</h3><p><a class=\"wl\" href=\"#marda-voss\">Marda Voss</a> holds an authenticated anomaly recording derived from Rhett's evidence. She wanted the physical sample for a stronger chain of custody, but the crew sold it to Dane. The recording remains protection, leverage and a possible route back to the crew.</p></div><div class=\"thread open\"><div class=\"st\">Reconstructed mystery</div><h3>The later visitors</h3><p>Years after the Imperial withdrawal, unknown visitors landed near <a class=\"wl\" href=\"#the-dome\">The Dome</a>, claimed to take nothing and left a recorder as a deliberate marker. Their identity, the reason for their hurried departure and Vossk's reaction to the recorded voice were not resolved in the surviving ledgers.</p></div><div class=\"thread open\"><div class=\"st\">Unresolved</div><h3>The shipboard witnesses</h3><p><a class=\"wl\" href=\"#sean\">Sean</a> and at least one other attendant remain tied to the confrontation at the ship. Michael escaped their custody once, and the shift clock that worried Sean has not disappeared.</p></div><div class=\"thread open\"><div class=\"st\">Unresolved</div><h3>Brak wants off before Dane</h3><p><a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> wanted his people set down before the crew went near Dane. The surviving <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> were still associated with the ship when the crew entered the resort; their precise position now matters.</p></div><div class=\"thread open\"><div class=\"st\">Background</div><h3>Rhett's debt</h3><p><a class=\"wl\" href=\"#rhett\">Rhett Sorn</a> stayed aboard the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a>, still cleaning sand and still owing for the crash.</p></div><div class=\"thread open\"><div class=\"st\">Loose end</div><h3>Sixteen tons of sand</h3><p>The resort still has no coherent answer about the declared cargo, and the manifest shifted from sixteen tons to 1.6 before anyone checked into the penthouse.</p></div>", "backlinks": ["overview"], "search": "open threads what the campaign is currently holding unresolved after session vi."}, {"id": "session-6", "title": "Session VI — Waterfalls and Loose Ends", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "The crew check in, find Dane, and chase an escaped security officer through paradise.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<p>The crew began where the previous session ended: in the galley of the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a>, with one unconscious security officer, a terrified attendant and a very profitable understanding with <a class=\"wl\" href=\"#vessaly\">Vessaly</a>. Vessaly left <a class=\"wl\" href=\"#sean\">Sean</a> to watch the prisoner and led <a class=\"wl\" href=\"#carsk\">Carsk</a>, <a class=\"wl\" href=\"#kess\">Kess</a> and <a class=\"wl\" href=\"#rethven\">Rethven</a> into the hidden workings of the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>. <a class=\"wl\" href=\"#sel\">Dr. Sel Varo</a> came along; <a class=\"wl\" href=\"#rhett\">Rhett Sorn</a> stayed aboard with the sand.</p><h2>Through the Bowels</h2><p>The way up ran through stairs, access corridors and the machinery that turns the resort's waterfalls into power. Before the public levels, Vessaly stopped the crew at the weapons line. Rifles and carbines went into a secured cupboard bought with a destiny point; pistols, a vibroknife and Carsk's knucklers remained concealed.</p><p>The Splendor above was almost offensively beautiful: greenery, mountain views, polished corridors and a many-storey waterfall descending through its central atrium. Vessaly installed the group in a deluxe penthouse on the eighth floor, with <a class=\"wl\" href=\"#rethven\">Rethven</a> presented as the wealthy guest and “Mr Shubidua” and “Lenny” entered as two of his associates. The price of Vessaly's help climbed to fifty percent.</p><h2>The Penthouse Stakeout</h2><p>The crew briefly committed to their cover with alarming enthusiasm. Rethven and Kess attended rooftop Pilates; Kess followed it with enough treatments to emerge glowing. Sel sampled the spa and fell asleep in the penthouse. Carsk stayed behind with the top-shelf brandy, a bath and the balcony.</p><p>That made him the first to spot <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> several rooms away. She was in a robe, sharing drinks and affection with a portly, self-assured man presumed to be <a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a>. Carsk hid successfully and fixed the location of her suite.</p><p>When Casimir returned to the balcony, he was joined by a comms-wearing figure in a bulky jacket, presumed to be <a class=\"wl\" href=\"#tessick\">Tessick</a>. Carsk made out the shape of a terse, conspiratorial business conversation. It stopped the instant Dane appeared. The three withdrew inside, but not before the bodyguard glanced towards the crew's balcony. Rethven noticed maintenance workers using the exterior routes around the suites — another possible way in.</p><h2>Michael Walks</h2><p>Vessaly's message changed the priority. His associate had failed to hold the security officer, whose name was now established as <a class=\"wl\" href=\"#security-officer\">Michael</a>. Michael had woken, left the ship and was moving through the resort. Vessaly surrendered five percent for the mistake, leaving his cut at forty-five.</p><p>Vessaly introduced the crew to <a class=\"wl\" href=\"#ottho\">Ottho</a>, the Gungan chief of maintenance, at the Level 3 sun deck. Ottho led them into a network of broad <a class=\"wl\" href=\"#service-tunnels\">Splendor Service Tunnels</a> and gave them a secluded terminal. Using Michael's stolen <a class=\"wl\" href=\"#security-cards\">security ID</a>, Kess accessed the staff cameras, found him near the grand staircase and plotted a direct route through the tunnels.</p><p>Carsk ran. He burst back into the atrium, surfed down the lobby waterfall and intercepted Michael on the stairs. A concealed vibroknife and a successful threat kept the officer still, but his colleague <a class=\"wl\" href=\"#trent\">Trent</a> arrived and called out to him.</p><p>Kess turned the resort's prejudice into a distraction. Drawing on his knowledge of Naboo, he claimed that Gungan room service had stolen his wife's Nubian pearl necklace; Rethven played the distraught wife. Trent accepted the story and went to deal with it. Michael, pleading that his sick father and unemployed mother depend on his wage, agreed to punch out and spend the next twenty-four hours in the crew's penthouse. Carsk escorted him away without bloodshed.</p><h2>A Face from the Board</h2><p>The session closed on Carsk's obligation. On the way downstairs with Michael, he passed a diplomat whose face he recognised from the web of photographs and red string aboard the Wayfarer's Debt — part of his long investigation into the terrorist attack that killed his family.</p><p>The diplomat remains unnamed. The recognition does not.</p><p>Each player received 10 XP.</p>", "backlinks": [], "search": "session vi — waterfalls and loose ends the crew check in, find dane, and chase an escaped security officer through paradise."}, {"id": "recap", "title": "Session V — The Price of Renewal", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Session recap — safe to share with the table.", "conf": "", "confLabel": "", "player": "", "aliases": [], "html": "<p>The crew lifted off the dome planet with sand in every vent of the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a> and a passenger list they had not planned on. Somewhere in the ducting, <a class=\"wl\" href=\"#rhett\">Rhett Sorn</a> was keeping his head down and working off what he owed for putting the ship in the dirt.</p><h2>Sand in the Vents</h2><p>Hyperspace did what hyperspace does: wounds closed, tempers cooled, and a plate of <a class=\"wl\" href=\"#kess\">Kess</a>'s dinner was buried under a cough of grit from the air vent. The one injury that would not sleep off was his, and he could hardly stitch himself. <a class=\"wl\" href=\"#rethven\">Rethven</a> took the needle. <a class=\"wl\" href=\"#sel\">Dr. Sel Varo</a> offered to assist, and <a class=\"wl\" href=\"#kess\">Kess</a> had to decide whether the clicking she had been making in the corridors at night was enough to keep her hands off him.</p><p>He let her help. It went better than anyone expected — <a class=\"wl\" href=\"#sel\">Dr. Sel Varo</a> turned out to be a deep well of medical knowledge, which is either something she had always hidden or something that has recently become true of her.</p><h2>Sixteen Whiskies</h2><p>Three survivors of <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> were still aboard, huddled at the dining table with nowhere to be: <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>, who had inherited command he never asked for, and his two, <a class=\"wl\" href=\"#tavi-renn\">Cpl Tavi Renn</a> and <a class=\"wl\" href=\"#emon-vale\">Spc Emon Vale</a>. <a class=\"wl\" href=\"#carsk\">Carsk</a> went in on shared service history and a hand on the shoulder, and read the room well enough to catch <a class=\"wl\" href=\"#tavi-renn\">Cpl Tavi Renn</a>'s hand sliding under the table and <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>'s single, silent shake of the head.</p><p><a class=\"wl\" href=\"#kess\">Kess</a> defused it with hospitality — a percussive slap to the sand-jammed drinks machine produced a tray of <a class=\"wl\" href=\"#corellian-whiskey\">Corellian Whiskey</a>, and the tension went out of the room. What followed was, by any measure, the most productive drinking session the crew has had: sixteen whiskies deep, <a class=\"wl\" href=\"#carsk\">Carsk</a> was standing on the table leading a chorus, and the last of the <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> wariness dissolved into something that looked a lot like loyalty.</p><p>The admission, when it came, was blunt. <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>'s people had been sent along with orders that the crew were not supposed to come back. Whatever <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> owes them now, he owes the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> more.</p><h2>The Vain Commander</h2><p>Asked how one gets to <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>, <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> did not describe a fortress. He described a weakness. Every few cycles the commander slips off the books and goes to <a class=\"wl\" href=\"#naboo\">Naboo</a>, to the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> — a mountainside retreat of engineered waterfalls and domed roofs where the galaxy's elite buy their youth back a treatment at a time. <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> knows the retreat, and he knows when she is due.</p><p>The <a class=\"wl\" href=\"#specimen\">The Specimen</a>'s missing components are somewhere behind <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>, in a facility <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a> says the seven of them could not crack. She herself, half-dressed in a spa robe, is another matter.</p><h2>Sixteen Tons of Exfoliating Sand</h2><p>The crew came in at the service entrance under the only cover story a ship full of grit could support: a bulk delivery of exfoliating sand. Traffic control was unconvinced, had no berth, no manifest and no patience, and held them in orbit for hours while the crew burned nerves in circles. Eventually the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> was allowed down onto a cramped auxiliary pad in the <a class=\"wl\" href=\"#servants-quarters\">The Servants' Quarters</a>, where no cargo could be unloaded and no repairs made.</p><p>Waiting at the bottom of the ramp was <a class=\"wl\" href=\"#vessaly\">Vessaly</a>, a bureaucrat with a data pad, two assistants and a security officer, all wearing the same expression at the sandy freighter now parked in their auxiliary port. He wanted forms the crew did not have, and answers about sixteen tons of cargo that plainly would not fit.</p><h2>It Goes Wrong at the Ramp</h2><p><a class=\"wl\" href=\"#carsk\">Carsk</a> lured one of the assistants aboard, put him against a bulkhead and made it clear that the crew needed uniforms. He may have overdone it — the young man went back down the ramp barely holding himself together. <a class=\"wl\" href=\"#rethven\">Rethven</a>, deciding that nobody was looking at him, made a break for the door and did not get there before the <a class=\"wl\" href=\"#security-officer\">Michael</a> did.</p><p><a class=\"wl\" href=\"#kess\">Kess</a> ended the fight before it started: a few taps on his pad and the ship's weapons unfolded from the hull over the heads of two now thoroughly persuaded bureaucrats. The <a class=\"wl\" href=\"#security-officer\">Michael</a> did not get the message, and he and <a class=\"wl\" href=\"#rethven\">Rethven</a> tumbled through a doorway into a corridor and out of everyone's sight. <a class=\"wl\" href=\"#carsk\">Carsk</a> arrived, got the man into a hold, and <a class=\"wl\" href=\"#rethven\">Rethven</a> finished it by loosening his own breath mask and exhaling <a class=\"wl\" href=\"#ammonia\">Ammonia</a> into the man's face until he went limp.</p><p>He is alive. Everyone checked twice.</p><h2>Thirty Percent</h2><p>Back at the ramp with uniforms, <a class=\"wl\" href=\"#security-cards\">Security Cards & Uniforms</a> and data pads in hand, <a class=\"wl\" href=\"#kess\">Kess</a> worked on <a class=\"wl\" href=\"#vessaly\">Vessaly</a> — no longer a hostage so much as a partner, once it emerged that he is exactly as corruptible as the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> is shiny. A story about very secret cargo for a very particular client, a negotiation that started at ten percent and somehow finished at thirty, and <a class=\"wl\" href=\"#vessaly\">Vessaly</a> was inside the plan.</p><p>He can find <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>. He also let slip two names nobody had before: <a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a>, a Nubian art dealer who comes here with her, and <a class=\"wl\" href=\"#tessick\">Tessick</a>, who shadows them both and whom <a class=\"wl\" href=\"#vessaly\">Vessaly</a> does not think is any kind of assistant.</p>", "backlinks": [], "search": "session v — the price of renewal session recap — safe to share with the table."}, {"id": "carsk", "title": "Carsk", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Furred war veteran. Located Dane, recaptured Michael, and recognised a face from his past.", "conf": "hi", "confLabel": "Confirmed", "player": "adjutator_", "aliases": ["Karsk", "Kask", "Cask", "Casque", "Karst"], "html": "<p>A veteran of a real war, which is the credential that got him through the door with <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a> when nothing else would have. Covered in fur and, by the end of sixteen whiskies, the most respected person in the room.</p><p>He works in two registers and switches between them without warning. In the first he is warm to the point of being disarming — a hand on <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>'s shoulder, sincere condolences about <a class=\"wl\" href=\"#vossk\">Vossk</a>, a song on the dining table. In the second he has a man against a bulkhead with <a class=\"wl\" href=\"#vibro-knucklers\">Vibro-knucklers</a> on, offering him the choice of conscious or unconscious, and is startled to find he has gone too far.</p><p>Holds a talent that lets him call in a small favour from current or former military personnel, and another that supports an ally's check simply by looking like a problem. Both saw use this session.</p><h2>At the Splendor</h2><p>Carsk used the crew's eighth-floor balcony as a stakeout and was the first to spot <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>. He fixed the location of her suite, identified her companion as the likely <a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a>, and partially read a conspiratorial exchange between Casimir and the presumed <a class=\"wl\" href=\"#tessick\">Tessick</a>. The bodyguard may have noticed him watching.</p><p>When <a class=\"wl\" href=\"#security-officer\">Michael</a> escaped the ship, Carsk sprinted through the <a class=\"wl\" href=\"#service-tunnels\">Splendor Service Tunnels</a>, surfed down the lobby waterfall and caught him on the grand staircase. He held a vibroknife discreetly to the officer's ribs, then talked him into taking a twenty-four-hour day off rather than hurting him.</p><h2>The Board</h2><p>Carsk has spent years investigating the mastermind behind the terrorist attack that killed his family. Aboard the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a>, faces and red string chart what he has learned. While escorting Michael away, he recognised an unnamed diplomat as one of those faces. That lead is now inside the Splendor.</p><div class=\"panel note\"><div class=\"ph\">Transcription note</div><p>Four distinct surface forms in one session, none of them the correct spelling. The registry resolves them on phonetic similarity plus context; a names file would have caught it at the source.</p></div>", "backlinks": ["harbingers-due", "overview", "timeline", "casimir-aldovane", "ilyra-dane", "corellian-whiskey", "sel", "security-officer", "threads", "earlier-campaign", "recap", "session-6", "brak-tanris", "trent", "vibro-knucklers"], "search": "carsk karsk kask cask casque karst furred war veteran. located dane, recaptured michael, and recognised a face from his past."}, {"id": "kess", "title": "Kess", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Pilot, mechanic and owner of the Wayfarer's Debt. Now glowing from a deeply unaffordable spa day.", "conf": "hi", "confLabel": "Confirmed", "player": "thygmn", "aliases": ["Kes"], "html": "<p>Flies the ship, fixes the ship, and is visibly happier doing the second. Spent most of this session with a toothbrush in the cockpit trying to get dome sand out from under the buttons, and delivered some of his best work of the campaign while only half listening.</p><p>His charm is geographically limited. Aboard the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> his social checks are upgraded and he is smooth, hospitable and quick — pouring <a class=\"wl\" href=\"#corellian-whiskey\">Corellian Whiskey</a>, talking traffic control in circles, promising a bureaucrat thirty percent of a cargo that does not exist. Off the ship, by his own cheerful admission, he is nothing special.</p><p>Carries a tier-four <em>Mad Inventor</em> talent, unused so far: once per session he can attempt to cobble together the functional equivalent of any item out of salvage. He opened the evening carrying a critical injury from the dome, and closed it running a hostage situation like a dinner party.</p><h2>At the Splendor</h2><p>Kess concealed his pistol among the tools in his vest, attended rooftop Pilates and then committed fully to the resort's treatments. The resulting bill is enormous and, in his mind, somebody else's problem.</p><p>At <a class=\"wl\" href=\"#ottho\">Ottho</a>'s terminal, he used <a class=\"wl\" href=\"#security-officer\">Michael</a>'s stolen security ID to search the resort's facial-recognition cameras and map a route through the <a class=\"wl\" href=\"#service-tunnels\">Splendor Service Tunnels</a>. When <a class=\"wl\" href=\"#trent\">Trent</a> threatened to expose Carsk's hold on Michael, Kess used <em>Applied Research</em> to substitute his knowledge of the Core Worlds for deception. His invented story about a stolen Nubian pearl necklace exploited the resort's prejudice against Gungans and drew Trent away.</p>", "backlinks": ["harbingers-due", "timeline", "sel", "marda-voss", "security-officer", "naboo", "ottho", "earlier-campaign", "rethven", "rhett", "security-cards", "recap", "session-6", "service-tunnels", "specimen", "wayfarers-debt", "trent", "vessaly"], "search": "kess kes pilot, mechanic and owner of the wayfarer's debt. now glowing from a deeply unaffordable spa day."}, {"id": "rethven", "title": "Rethven", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Gand. Ammonia breather, ten years in the Dome, and unexpectedly convincing as a wealthy spa guest.", "conf": "hi", "confLabel": "Confirmed", "player": "aetius3185", "aliases": ["Rathven", "Rethvin", "Rethan", "Reflin", "Rathfin", "Gant"], "html": "<p>Spent a decade inside <a class=\"wl\" href=\"#the-dome\">The Dome</a> and has been almost nowhere since, which shows: he bounds down the ramp at the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> purely because it is somewhere new, and gets mistaken for a reclusive billionaire on the strength of not understanding what credits are.</p><p>Breathes <a class=\"wl\" href=\"#ammonia\">Ammonia</a> through a mask, which became a weapon when a glancing blow knocked it loose mid-scrap — he held his breath, sat on the <a class=\"wl\" href=\"#security-officer\">Michael</a>'s chest and exhaled until the man stopped moving. Awkward, effective, and entirely in character.</p><p>His obligation is a fascination with what cannot be explained.</p><h2>At the Splendor</h2><p>The desk accepted Rethven as the party's principal guest, and the crew followed that misunderstanding into an eighth-floor penthouse. He threw himself into rooftop Pilates, then later noticed maintenance workers moving around the balconies near <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>'s suite. Those exterior routes may offer a way in.</p><p>When <a class=\"wl\" href=\"#kess\">Kess</a> accused Gungan room service of stealing his wife's Nubian pearl necklace, Rethven played the distressed wife convincingly enough to help draw <a class=\"wl\" href=\"#trent\">Trent</a> away from <a class=\"wl\" href=\"#security-officer\">Michael</a>.</p><div class=\"panel note\"><div class=\"ph\">Transcription note</div><p>Whisper repeatedly hears his species, <em>Gand</em>, as a personal name, \"Gant\" — and the table sometimes calls him that too. A naive extractor would create a separate character page for it. Flagged as an alias rather than merged silently, because a human should confirm this one.</p></div>", "backlinks": ["ammonia", "timeline", "security-officer", "recap", "session-6", "the-dome", "trent"], "search": "rethven rathven rethvin rethan reflin rathfin gant gand. ammonia breather, ten years in the dome, and unexpectedly convincing as a wealthy spa guest."}, {"id": "tavi-renn", "title": "Cpl Tavi Renn", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Imperial. Reached under the table first.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Tavi", "Tabby"], "html": "<p>One of the two survivors still following <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>. During the first conversation aboard, her hand moved from the top of the table to underneath it and she exchanged a look with <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>, who shook his head once. That was a signal, and the crew saw it.</p>", "backlinks": ["timeline", "recap", "vossk-squad", "wreckfall-nine"], "search": "cpl tavi renn tavi tabby imperial. reached under the table first."}, {"id": "sel", "title": "Dr. Sel Varo", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Crew. Something is inside her; for one afternoon, the spa was more interesting.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["Sel", "Cell"], "html": "<p>A former <a class=\"wl\" href=\"#cygnus-biotech\">Cygnus Biotech</a> insider who joined the crew after the <a class=\"wl\" href=\"#harbingers-due\">Harbinger</a> crisis. She helped interpret the organism and warned that Cygnus would treat witnesses as a containment problem. <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> recognised her during the sale aboard <a class=\"wl\" href=\"#long-wake\">the Long Wake</a>, but Sel did not explain their complete history.</p><p>Wanted a gentler outcome at <a class=\"wl\" href=\"#the-dome\">The Dome</a> than the one she got, and is still sour about it. She is also making a clicking noise in the ship's corridors late at night, which <a class=\"wl\" href=\"#kess\">Kess</a> has not stopped thinking about.</p><p>She assisted on the medicine check that closed <a class=\"wl\" href=\"#kess\">Kess</a>'s critical injury, and proved a font of knowledge she has never demonstrated before. The open question is whether she always had it and hid it, or whether it arrived recently along with everything else.</p><p><a class=\"wl\" href=\"#carsk\">Carsk</a> has stated in front of her that he intends to get whatever is in her body out of it. She asked what he was talking about. Nobody answered.</p><p>At the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>, Sel passed easily among the guests, sampled the treatments and became relaxed enough to fall asleep in the crew's penthouse. The clicking and unexplained medical knowledge remain unresolved.</p>", "backlinks": ["timeline", "cygnus-biotech", "marda-voss", "threads", "recap", "session-6"], "search": "dr. sel varo sel cell crew. something is inside her; for one afternoon, the spa was more interesting."}, {"id": "marda-voss", "title": "Marda Voss", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Evidence custodian on Port Heska who sealed part of the specimen trail.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Accepted <a class=\"wl\" href=\"#kess\">Kess</a> and <a class=\"wl\" href=\"#sel\">Dr. Sel Varo</a> into a secured evidence intake at <a class=\"wl\" href=\"#port-heska\">Port Heska</a>. Kess provided an honest account of the <a class=\"wl\" href=\"#cygnus-biotech\">Cygnus Biotech</a> operation, the surviving witnesses and the anomaly associated with the <a class=\"wl\" href=\"#specimen\">The Specimen</a>.</p><p>Marda authenticated and timestamped a recording derived from <a class=\"wl\" href=\"#rhett\">Rhett Sorn</a>'s evidence, creating a sealed copy outside Cygnus control. A corporate verification process stirred during authentication before she cut the connection.</p><p>She wanted the physical sample to establish a stronger chain of custody, but the crew later sold it to <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a>. Her sealed recording remains a surviving evidence trail and a potentially awkward promise.</p>", "backlinks": ["threads", "port-heska", "earlier-campaign", "rhett", "specimen"], "search": "marda voss evidence custodian on port heska who sealed part of the specimen trail."}, {"id": "ottho", "title": "Ottho", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Gungan chief of maintenance at the Splendor. Knows every service route.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Otto", "Mario"], "html": "<p>Chief of maintenance at the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>, introduced by <a class=\"wl\" href=\"#vessaly\">Vessaly</a> at the Level 3 sun-deck pool. Ottho is a dark-skinned Gungan equipped with the same sort of tools and practical clutter that <a class=\"wl\" href=\"#kess\">Kess</a> carries.</p><p>He initially resisted giving strangers access to the security system, then accepted Vessaly's assurance that the problem was important. He opened the hidden <a class=\"wl\" href=\"#service-tunnels\">Splendor Service Tunnels</a>, led the crew to a secluded maintenance terminal and left them with access that <a class=\"wl\" href=\"#severin\">Severin</a> was unlikely to notice.</p><p>Other Gungans work throughout the tunnels. What the crew saw suggests that the resort's immaculate public face depends on an underclass kept largely out of sight.</p>", "backlinks": ["overview", "timeline", "kess", "session-6", "severin", "service-tunnels", "nubian-aqua-splendor", "vessaly"], "search": "ottho otto mario gungan chief of maintenance at the splendor. knows every service route."}, {"id": "rhett", "title": "Rhett Sorn", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Crashed the ship. Working off the debt by cleaning sand while the crew visits the spa.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Rhett", "Ahet"], "html": "<p>An engineer rescued from the <a class=\"wl\" href=\"#harbingers-due\">CSS Harbinger's Due</a> and a practical witness to the <a class=\"wl\" href=\"#specimen\">The Specimen</a>'s shipboard behaviour. His technical evidence helped <a class=\"wl\" href=\"#marda-voss\">Marda Voss</a> create a sealed anomaly record at <a class=\"wl\" href=\"#port-heska\">Port Heska</a>. That history also makes him someone <a class=\"wl\" href=\"#cygnus-biotech\">Cygnus Biotech</a> may wish to control.</p><p>Later responsible for putting the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> into the dirt, and currently slinking around it feeling poorly about himself. <a class=\"wl\" href=\"#kess\">Kess</a> is in no hurry to let him leave — there is a debt to work off and nowhere to go.</p><p>He remained aboard during the crew's first day inside the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>, sweeping out sand and being kept away from the ship's unlabelled controls.</p>", "backlinks": ["harbingers-due", "timeline", "cygnus-biotech", "marda-voss", "threads", "earlier-campaign", "recap", "session-6", "wayfarers-debt"], "search": "rhett sorn rhett ahet crashed the ship. working off the debt by cleaning sand while the crew visits the spa."}, {"id": "brak-tanris", "title": "Sgt Brak Tanris", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Heavy weapons. Inherited command of what's left of Vossk's squad.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Brak", "Brack", "Barrack"], "html": "<p>Was the bulk of <a class=\"wl\" href=\"#vossk-squad\">Vossk's Squad</a>, not its brain, and command fell to him when <a class=\"wl\" href=\"#vossk\">Vossk</a> did not come back. Talks about himself in the third person. Holds his liquor. Referred to his dead commander's paperwork failings before he referred to his grief.</p><p>Warmed to <a class=\"wl\" href=\"#carsk\">Carsk</a> over an evening and sixteen whiskies, and came out the other side offering something he was not asked for: his people's help, and the knowledge of where <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> will be. He is the only remaining connection to her.</p><p>His caveat stands — his squad were sent to tie off loose ends, and the crew are the loose ends. He wanted to be set down somewhere before anyone went near the commander. The crew have now located Dane inside the Splendor without establishing exactly where Brak and the remaining squad were left.</p>", "backlinks": ["timeline", "carsk", "ilyra-dane", "tavi-renn", "threads", "recap", "vossk-squad", "wreckfall-nine"], "search": "sgt brak tanris brak brack barrack heavy weapons. inherited command of what's left of vossk's squad."}, {"id": "emon-vale", "title": "Spc Emon Vale", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Imperial. Took two glasses.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Emon", "Emin"], "html": "<p>The other survivor. Claimed two whiskies off the tray at once and was pleased with himself about it. Still moves like he thinks he is being stealthy in a corridor.</p>", "backlinks": ["recap", "vossk-squad", "wreckfall-nine"], "search": "spc emon vale emon emin imperial. took two glasses."}, {"id": "vossk", "title": "Vossk", "group": "Crew & Allies", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Former squad leader. Kept by the Specimen.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Vosk", "Bosk"], "html": "<p>Led the Imperial squad into <a class=\"wl\" href=\"#the-dome\">The Dome</a> and did not leave it — the <a class=\"wl\" href=\"#specimen\">The Specimen</a> chose to keep him as part of the bargain. His survivors drank to him aboard the <a class=\"wl\" href=\"#wayfarers-debt\">The Wayfarer's Debt</a> and then got on with their lives, which tells you something about the squad.</p>", "backlinks": ["timeline", "carsk", "threads", "brak-tanris", "the-dome", "specimen", "vossk-squad", "wreckfall-nine"], "search": "vossk vosk bosk former squad leader. kept by the specimen."}, {"id": "verrin-kallax", "title": "Captain Verrin Kallax", "group": "Adversaries", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Rival salvager whose first partnership with the crew ended in violence and lost leverage.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Verrin Kallax", "Captain Kallax"], "html": "<p>Led the competing salvage crew that reached the <a class=\"wl\" href=\"#harbingers-due\">CSS Harbinger's Due</a> shortly after the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a>. He initially accepted a joint claim, but mutual suspicion and the arrival of <a class=\"wl\" href=\"#cygnus-biotech\">Cygnus Biotech</a> turned the derelict into a three-sided struggle.</p><p>Kallax survived. His local network later moved against the crew at <a class=\"wl\" href=\"#port-heska\">Port Heska</a>, where the operation was badly disrupted. He still knows enough about the specimen, the witnesses and the sale to matter.</p><p>Whether his next move is retaliation, bargaining or the sale of information remains open.</p>", "backlinks": ["harbingers-due", "threads", "port-heska", "earlier-campaign"], "search": "captain verrin kallax verrin kallax captain kallax rival salvager whose first partnership with the crew ended in violence and lost leverage."}, {"id": "casimir-aldovane", "title": "Casimir Aldovane", "group": "Adversaries", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Nubian art dealer. Dane's companion, and possibly pursuing an agenda of his own.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Casimir Aldovana"], "html": "<p>Held in high esteem in Nubian political circles, and comes to the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> with <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> periodically, for treatments and — per <a class=\"wl\" href=\"#vessaly\">Vessaly</a> — other things.</p><p><a class=\"wl\" href=\"#carsk\">Carsk</a> saw Dane canoodling on a balcony with a portly, balding and conspicuously self-assured man in a robe. Vessaly's description makes Casimir the likely identification, though the crew have not spoken to him.</p><p>The same man later held a terse business conversation with a bulky, comms-wearing figure presumed to be <a class=\"wl\" href=\"#tessick\">Tessick</a>. The exchange appeared conspiratorial and stopped abruptly when Dane stepped onto the balcony. That reaction suggests an agenda they are keeping from her.</p>", "backlinks": ["overview", "timeline", "carsk", "ilyra-dane", "threads", "recap", "session-6", "tessick"], "search": "casimir aldovane casimir aldovana nubian art dealer. dane's companion, and possibly pursuing an agenda of his own."}, {"id": "ilyra-dane", "title": "Commander Ilyra Dane", "group": "Adversaries", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Imperial commander. Located inside the Splendor, but not yet approached.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Elira Dane", "Ilya Dayne", "Elenia Dane", "Elyra Dane", "Lyra", "Mistress Dane"], "html": "<p>Holds the <a class=\"wl\" href=\"#specimen\">The Specimen</a>'s missing components and, by <a class=\"wl\" href=\"#brak-tanris\">Sgt Brak Tanris</a>'s account, will never part with them for credits. She is not a person the crew can buy; she is a person they have to reach.</p><p>The crew previously sold those components to her aboard <a class=\"wl\" href=\"#long-wake\">the Long Wake</a>. Dane identified the organism as MYRMEX-9, paid for the severed limb and cryogenic equipment, supplied cover for the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a>, and gave the crew the coordinates that eventually led them to <a class=\"wl\" href=\"#the-dome\">The Dome</a>. The relationship began as a transaction and has never become trust.</p><p>Her weakness is her face. Every few cycles she goes quietly to <a class=\"wl\" href=\"#naboo\">Naboo</a> and checks into the <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a> for treatments meant to restore the sharp, hawkish look she had as a young officer. She travels off the books. <a class=\"wl\" href=\"#vessaly\">Vessaly</a> has her on the guest list as <em>Mistress Dane</em> and did not connect her to any Imperial rank at all.</p><p>She arrived a few days ago. <a class=\"wl\" href=\"#carsk\">Carsk</a> spotted her on an eighth-floor balcony with a portly man presumed to be <a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a> and established which suite she is using. Their affection appeared romantic.</p><p>Later, Casimir and the presumed <a class=\"wl\" href=\"#tessick\">Tessick</a> stopped a conspiratorial conversation as soon as Dane appeared. She went inside with them, apparently unaware of what had just been discussed. The crew have located her without making contact.</p><div class=\"panel note\"><div class=\"ph\">Five surface forms, one person</div><p>The table itself could not settle on a pronunciation, so the transcript carries every attempt. This is the entity that most justifies a human approval step: an automated merge on phonetic distance alone could just as easily have split her into two commanders.</p></div>", "backlinks": ["overview", "timeline", "carsk", "casimir-aldovane", "cygnus-biotech", "sel", "marda-voss", "threads", "earlier-campaign", "rethven", "recap", "session-6", "severin", "brak-tanris", "service-tunnels", "tessick", "the-dome", "long-wake", "nubian-aqua-splendor", "specimen"], "search": "commander ilyra dane elira dane ilya dayne elenia dane elyra dane lyra mistress dane imperial commander. located inside the splendor, but not yet approached."}, {"id": "security-officer", "title": "Michael", "group": "Adversaries", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Splendor security officer. Escaped the ship, then accepted a coerced day off.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["The Security Officer"], "html": "<p>Reached the corridor door at the same moment <a class=\"wl\" href=\"#rethven\">Rethven</a> did and would not let go. Took a pin from <a class=\"wl\" href=\"#carsk\">Carsk</a>, kept reaching for his baton anyway, and was finally put out by <a class=\"wl\" href=\"#ammonia\">Ammonia</a>. His <a class=\"wl\" href=\"#security-cards\">security ID</a> and uniform went to the crew.</p><p>His name became known when he woke aboard the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a>, slipped past <a class=\"wl\" href=\"#sean\">Sean</a> and returned to the resort. <a class=\"wl\" href=\"#kess\">Kess</a> tracked him through staff cameras using the stolen ID. Carsk intercepted him on the grand staircase and held a concealed vibroknife to his ribs.</p><p>Michael pleaded that his sick father and unemployed mother depend on his income. He agreed to punch out and spend the next twenty-four hours in the crew's penthouse, and Carsk escorted him away. He has not changed sides; he is frightened, compromised and on a clock.</p>", "backlinks": ["ammonia", "overview", "timeline", "carsk", "kess", "threads", "rethven", "sean", "security-cards", "recap", "session-6", "severin", "service-tunnels", "servants-quarters", "wayfarers-debt", "trent", "vessaly"], "search": "michael the security officer splendor security officer. escaped the ship, then accepted a coerced day off."}, {"id": "sean", "title": "Sean", "group": "Adversaries", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "A terrified Splendor attendant left aboard the Wayfarer's Debt.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>One of <a class=\"wl\" href=\"#vessaly\">Vessaly</a>'s attendants. The crew's attempts to calm him in the galley of the <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a> only made him cry harder. Vessaly ordered him to remain aboard and watch the unconscious <a class=\"wl\" href=\"#security-officer\">Michael</a> while the crew entered the resort.</p><p>Sean warned that the missing staff would eventually be noticed. He did not prevent Michael from waking and leaving the ship.</p>", "backlinks": ["timeline", "security-officer", "threads", "session-6", "wayfarers-debt"], "search": "sean a terrified splendor attendant left aboard the wayfarer's debt."}, {"id": "severin", "title": "Severin", "group": "Adversaries", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Security chief of the Aqua Splendor. Runs a tight ship.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>The <a class=\"wl\" href=\"#nubian-aqua-splendor\">The Nubian Aqua Splendor</a>'s security chief. <a class=\"wl\" href=\"#vessaly\">Vessaly</a> warned that searching directly for <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> could attract his attention and described him as strict about access to guest and security data.</p><p>The crew avoided that scrutiny by using <a class=\"wl\" href=\"#ottho\">Ottho</a>'s unofficial terminal in the <a class=\"wl\" href=\"#service-tunnels\">Splendor Service Tunnels</a> and the stolen credentials of <a class=\"wl\" href=\"#security-officer\">Michael</a>. Severin has not yet appeared in person.</p>", "backlinks": ["ottho", "nubian-aqua-splendor", "vessaly"], "search": "severin security chief of the aqua splendor. runs a tight ship."}, {"id": "tessick", "title": "Tessick", "group": "Adversaries", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The presumed bodyguard may have noticed the crew watching Dane's suite.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["Tessic", "Tessicvar"], "html": "<p>A very strange individual who is always with them. <a class=\"wl\" href=\"#vessaly\">Vessaly</a> describes him as an assistant and then immediately says he thinks it is more than that.</p><p>The crew later watched a figure in a bulky jacket and communications headset arguing quietly with <a class=\"wl\" href=\"#casimir-aldovane\">Casimir Aldovane</a>. The business relationship and bodyguard role fit Vessaly's description of Tessick, but the identification remains an in-character presumption. Their conversation stopped when <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> appeared. Before going inside, the figure glanced towards the crew's balcony and may have noticed the surveillance.</p><p><em>Earmarked for Jesse to run as an NPC next session; the character sheet is going out.</em></p>", "backlinks": ["overview", "timeline", "carsk", "casimir-aldovane", "ilyra-dane", "threads", "recap", "session-6"], "search": "tessick tessic tessicvar the presumed bodyguard may have noticed the crew watching dane's suite."}, {"id": "specimen", "title": "The Specimen", "group": "Adversaries", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Beneath the Dome. Wants its missing parts back.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["MYRMEX-9", "Project MYRMEX-9"], "html": "<p>The Imperial quarantine designation for the entity is <strong>MYRMEX-9</strong>. The crew first encountered its effects aboard the <a class=\"wl\" href=\"#harbingers-due\">CSS Harbinger's Due</a>, where it moved through conductive structures, interfered with systems and hunted through the powered ship. Abrupt cold and sealed compartments could hinder it.</p><p>The crew escaped with a severed limb and cryogenic equipment. After preserving evidence with <a class=\"wl\" href=\"#marda-voss\">Marda Voss</a>, they sold those physical assets to <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> aboard <a class=\"wl\" href=\"#long-wake\">the Long Wake</a>. Dane connected MYRMEX-9 to an older Imperial recovery programme and the Outer Rim origin site.</p><p>Kept <a class=\"wl\" href=\"#vossk\">Vossk</a> as part of a bargain and let the rest of them go. In exchange for access to whatever lies beneath <a class=\"wl\" href=\"#the-dome\">The Dome</a>, it asked the crew to recover its missing components from <a class=\"wl\" href=\"#ilyra-dane\">Commander Ilyra Dane</a> — components the crew themselves cut off and sold.</p><p>It had tendrils in people and was controlling them, a detail <a class=\"wl\" href=\"#kess\">Kess</a> found reassuring on the grounds that it clearly knows its way around a body.</p><p><em>Table note: saying its name is a running bit with a secret clock attached. The transcript contains roughly thirty consecutive invocations. This is a genuinely hard case for a summariser, which will read the repetition as significance.</em></p>", "backlinks": ["harbingers-due", "overview", "timeline", "ilyra-dane", "marda-voss", "earlier-campaign", "rhett", "recap", "the-dome", "long-wake", "vossk", "vossk-squad", "wreckfall-nine"], "search": "the specimen myrmex-9 project myrmex-9 beneath the dome. wants its missing parts back."}, {"id": "trent", "title": "Trent", "group": "Adversaries", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Splendor security officer and Michael's colleague.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "html": "<p>Encountered <a class=\"wl\" href=\"#carsk\">Carsk</a> holding <a class=\"wl\" href=\"#security-officer\">Michael</a> at concealed knifepoint on the grand staircase. Before Trent could examine the situation, <a class=\"wl\" href=\"#kess\">Kess</a> claimed that Gungan room service had stolen his wife's Nubian pearl necklace and <a class=\"wl\" href=\"#rethven\">Rethven</a> played along.</p><p>Trent accepted the accusation immediately, muttered “Gungans again” to Michael and went to investigate. His reaction exposed the prejudice built into the resort's security culture and removed him from the confrontation without violence.</p>", "backlinks": ["timeline", "kess", "naboo", "rethven", "session-6", "nubian-aqua-splendor"], "search": "trent splendor security officer and michael's colleague."}, {"id": "vessaly", "title": "Vessaly", "group": "Adversaries", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Head bureaucrat at the Aqua Splendor. Currently bought for forty-five percent.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Vesely", "Vasily", "Fessily", "Vespa", "Vessel"], "html": "<p>Met the ship at the ramp with a data pad and a list of forms, and held the line on paperwork right up until the ship's guns came out. Cried, but less than his assistants, and was identified by <a class=\"wl\" href=\"#kess\">Kess</a> as the bravest of them on exactly that basis.</p><p>What turned him was not fear. It was the suggestion of an undeclared, very valuable cargo for a very particular client. He started licking his lips, forgot he was a prisoner, and negotiated himself from ten percent to thirty, then to fifty as he led the crew into the resort.</p><p>Vessaly installed them in an eighth-floor penthouse, warned them that <a class=\"wl\" href=\"#severin\">Severin</a> watches guest searches, and introduced them to <a class=\"wl\" href=\"#ottho\">Ottho</a>. When his associate failed to contain <a class=\"wl\" href=\"#security-officer\">Michael</a>, he surrendered five percent for the error. His current cut is forty-five percent.</p><p>He is an asset for exactly as long as the arrangement is the best one available to him.</p>", "backlinks": ["overview", "timeline", "casimir-aldovane", "ilyra-dane", "ottho", "sean", "security-cards", "recap", "session-6", "severin", "tessick", "nubian-aqua-splendor"], "search": "vessaly vesely vasily fessily vespa vessel head bureaucrat at the aqua splendor. currently bought for forty-five percent."}, {"id": "harbingers-due", "title": "CSS Harbinger's Due", "group": "Places", "type": "place", "typeLabel": "Place", "layout": "prose", "dek": "The drifting freighter where a salvage claim became the campaign's first containment crisis.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": ["Harbinger's Due", "The Harbinger"], "html": "<p>A bulk freighter found drifting in the Gorrath asteroid belt with power and life support still running but almost no crew aboard. The <a class=\"wl\" href=\"#wayfarers-debt\">Wayfarer's Debt</a> reached it as <a class=\"wl\" href=\"#verrin-kallax\">Captain Verrin Kallax</a>'s salvagers and <a class=\"wl\" href=\"#cygnus-biotech\">Cygnus Biotech</a> converged on the same claim.</p><p>Inside, <a class=\"wl\" href=\"#kess\">Kess</a> and <a class=\"wl\" href=\"#carsk\">Carsk</a> found a failed containment operation and an organism loose in the vessel's structure. They escaped with <a class=\"wl\" href=\"#rhett\">Rhett Sorn</a>, a severed specimen limb, cryogenic equipment and evidence that Cygnus regarded the ship as a recovery site rather than a rescue.</p><p>The precise room-to-room history is intentionally omitted from the public reconstruction. What endured was the lesson that the <a class=\"wl\" href=\"#specimen\">The Specimen</a> can exploit powered infrastructure and that abrupt cold can slow it.</p>", "backlinks": ["verrin-kallax", "cygnus-biotech", "sel", "port-heska", "earlier-campaign", "rhett", "long-wake", "specimen"], "search": "css harbinger's due harbinger's due the harbinger the drifting freighter where a salvage claim became the campaign's first containment crisis."}, {"id": "naboo", "title": "N
